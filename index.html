        ${f.parent===null?`<div class="field"><label>Colour</label><div class="swatches">${PALETTE.map(c=>`<span class="sw ${n.color===c?'sel':''}" style="background:${c}" data-color="${c}"></span>`).join('')}</div></div>`:''}
        <div class="field"><label>Move to</label><select id="stMove">${moveOptions(n,f)}</select></div>
        <div class="field"><button class="btn cal" id="stFocus">${ICON.target} Focus this branch in tree</button></div>
        <div class="field"><button class="btn del" id="stDel">Delete project</button></div>
      </details>`;
      body+=`</div>`; // sheet-body
    } else {
      // TASK / EVENT / DEADLINE
      body+=`<div class="sheet-body">`;
      // kind selector
      body+=`<div class="field"><label>Type</label><div class="status-row">
        ${[['task','Task'],['event','Event'],['deadline','Deadline']].map(([v,l])=>`<div class="status-opt ${k===v?'sel':''}" data-setkind="${v}">${l}</div>`).join('')}
      </div></div>`;
      // date (+ time for events)
      body+=`<div class="field"><label>${k==='event'?'Date':k==='deadline'?'Due date':'Due date'}</label><input type="date" id="stDate" value="${n.dueDate||''}"/></div>`;
      if(k==='event') body+=`<div class="field"><label>Time (optional)</label><input type="text" id="stTime" placeholder="e.g. 2:00 PM" value="${esc(n.eventTime||'')}"/></div>`;
      if(k==='task'){
        // status/flow
        body+=`<div class="field"><label>Status</label><div class="status-row">
          ${[['active','Active'],['waiting','Waiting'],['blocked','Blocked']].map(([v,l])=>`<div class="status-opt ${flowOf(n)===v?'sel':''}" data-setflow="${v}">${l}</div>`).join('')}
        </div></div>`;
        if(flowOf(n)==='waiting') body+=`<div class="field"><label>Waiting for</label><input type="text" id="stWaitFor" placeholder="e.g. Saad — asset data" value="${esc(n.waitingFor||'')}"/></div>`;
        if(flowOf(n)==='blocked') body+=`<div class="field"><label>Blocked by</label><input type="text" id="stBlockBy" placeholder="e.g. Client data" value="${esc(n.blockedBy||'')}"/></div>`;
        // timer
        body+=`<div class="field"><label>Timer</label><div class="timer-box">
          <span class="timer-read ${n.timerRunning?'running':''}" id="stTimer">${n.timerRunning?fmtClock(ls):fmtDur(ls)}</span>
          <button class="timer-reset" id="stReset">reset</button>
          <button class="timer-btn ${n.timerRunning?'stop':'start'}" id="stTimerBtn">${n.timerRunning?ICON.pause+' Stop':ICON.play+' Start'}</button>
        </div></div>`;
        // repeat
        body+=`<div class="field"><label>Repeat</label><div class="status-row">
          ${[['none','Once'],['daily','Daily'],['weekly','Weekly'],['monthly','Monthly']].map(([v,l])=>`<div class="status-opt ${((n.repeat||'none')===v)?'sel':''}" data-setrepeat="${v}">${l}</div>`).join('')}
        </div></div>`;
        // next action
        const proj=ancestorProject(n.id);
        const isNext = proj && proj.nextActionId===n.id;
        body+=`<div class="field"><button class="btn cal" id="stNext">${ICON.target} ${isNext?'This is the Next Action':'Set as Next Action'}</button></div>`;
      }
      // notes
      body+=`<div class="section-label">Notes</div><textarea id="stNotes" class="sheet-notes" placeholder="Notes, links, context…">${esc(n.notes||'')}</textarea>`;
      // secondary
      body+=`<details class="settings-fold"><summary>More</summary>
        <div class="field"><label>Move to</label><select id="stMove">${moveOptions(n,f)}</select></div>
        <div class="field"><button class="btn cal" id="stCal">${ICON.cal} Add to calendar (.ics)</button></div>
        <div class="field"><button class="btn del" id="stDel">Delete</button></div>
      </details>`;
      body+=`</div>`;
    }

    body+=`</div></div>`;
    host.innerHTML=body;
    wireSheet(n,f);
  }
  function moveOptions(n,f){
    const targets=branchTargets(n.id); const cur=f.parent?f.parent.id:'';
    return `<option value="" ${cur===''?'selected':''}>— Top level (workspace)</option>`+
      targets.map(t=>`<option value="${t.id}" ${cur===t.id?'selected':''}>${'· '.repeat(t.depth)}${esc(t.name)}</option>`).join('');
  }
  function sheetItemRow(c,parent){
    const leaf=isLeaf(c), k=kindOf(c), col=statusColor(c);
    const lead = leaf?(k==='task'?`<button class="check ${c.completed?'on':''}" data-done="${c.id}">${c.completed?ICON.check:''}</button>`:`<span class="pkind" style="color:${col}">${kindIcon(c)}</span>`)
      : `<span class="pkind" style="color:${col}">${ICON.box}</span>`;
    let meta='';
    if(leaf){ const d=dueMeta(c.dueDate); if(k==='event') meta=eventDateLabel(c); else if(d) meta=d.label; if(flowOf(c)==='waiting') meta=(meta?meta+' · ':'')+'waiting'; if(flowOf(c)==='blocked') meta=(meta?meta+' · ':'')+'blocked'; }
    else { const s=summarize(c); meta=s.open+' open'+(s.overdue?' · '+s.overdue+' overdue':''); }
    const isNext = parent.nextActionId===c.id;
    return `<div class="prow leaf sheet-item">
      ${lead}
      <button class="pmain" data-open="${c.id}">
        <span class="ptitle-row"><span class="ptitle ${c.completed?'done':''}">${esc(c.name)}</span>${isNext?'<span class="badge b-next">NEXT</span>':''}${(!leaf)?badge(c):''}</span>
        ${meta?`<span class="psub">${esc(meta)}</span>`:''}
      </button>
      <button class="pmenu" data-rowmenu="${c.id}">${ICON.dots}</button>
    </div>`;
  }

  /* ---- Global search ---- */
  function renderSearch(){
    const host=document.getElementById('sheetHost');
    const q=searchQuery.trim().toLowerCase();
    let results=[];
    if(q){
      walk(n=>{
        const hay=(n.name||'')+' '+(n.notes||'')+' '+(n.waitingFor||'')+' '+(n.blockedBy||'');
        if(hay.toLowerCase().indexOf(q)>=0) results.push(n);
      });
    }
    const rows = results.slice(0,40).map(n=>{
      const c=crumbs(n.id); const trail=c.map(x=>esc(x.name)).join(' › ');
      const k=kindOf(n).toUpperCase(); const d=dueMeta(n.dueDate);
      const meta=[k]; if(d) meta.push(d.label.toUpperCase());
      return `<div class="sr-row">
        <button class="sr-main" data-open="${n.id}">
          <span class="sr-name">${esc(n.name)}</span>
          <span class="sr-trail">${trail||'Work'}</span>
          <span class="sr-meta">${meta.join(' · ')}</span>
        </button>
        ${!isLeaf(n)?`<button class="sr-focus" data-focus="${n.id}" title="Focus in tree">${ICON.target}</button>`:''}
      </div>`;
    }).join('');
    host.innerHTML=`<div class="scrim" id="scrim"><div class="sheet full" id="sheet">
      <div class="sheet-top">
        <button class="sheet-back" id="stBack">${ICON.back}</button>
        <div class="sheet-top-mid"><input class="search-input" id="searchInput" placeholder="Search projects, tasks, events, notes…" value="${esc(searchQuery)}"/></div>
      </div>
      <div class="sheet-body">
        ${q? (results.length?rows:`<div class="empty">No matches for "${esc(searchQuery)}".</div>`) : `<div class="hint" style="padding:10px 2px">Type to search across everything — workspaces, projects, tasks, events, deadlines, and notes.</div>`}
      </div>
    </div></div>`;
    const si=document.getElementById('searchInput'); si.focus();
    si.oninput=()=>{ searchQuery=si.value; const pos=si.selectionStart; renderSearch(); const n2=document.getElementById('searchInput'); if(n2){ n2.focus(); try{n2.setSelectionRange(pos,pos);}catch(e){} } };
    document.getElementById('scrim').onclick=e=>{ if(e.target.id==='scrim'){ searchOpen=false; renderSheet(); } };
    document.getElementById('stBack').onclick=()=>{ searchOpen=false; renderSheet(); };
    host.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>{ openSheet(el.dataset.open); });
    host.querySelectorAll('[data-focus]').forEach(el=>el.onclick=()=>{ searchOpen=false; focusInTree(el.dataset.focus); });
    host.querySelectorAll('[data-rowmenu]').forEach(el=>el.onclick=e=>{ e.stopPropagation(); openRowMenu(el.dataset.rowmenu,e); });
  }

  /* ============ WIRING ============ */
  function wire(){
    document.getElementById('tabs').querySelectorAll('.tab').forEach(t=>t.onclick=()=>{ tab=t.dataset.tab; addingUnder=null; if(tab!=='maps'){ mapId=null; mapNodeId=null; mapSel.clear(); mapSelectMode=false; } render(); });
    const aw=document.getElementById('addWs'); if(aw) aw.onclick=()=>{ const name=prompt('Workspace name'); if(name) addChild(null,name,'workspace'); };
    const sb=document.getElementById('settingsBtn'); if(sb) sb.onclick=()=>{ sheetId=null; ideaId=null; searchOpen=false; mapNodeId=null; settingsOpen=true; renderSheet(); };
    const seb=document.getElementById('searchBtn'); if(seb) seb.onclick=()=>{ settingsOpen=false; sheetId=null; ideaId=null; mapNodeId=null; searchOpen=true; renderSheet(); };

    document.querySelectorAll('[data-exp]').forEach(el=>el.onclick=e=>{ e.stopPropagation(); toggleExpand(el.dataset.exp); });
    document.querySelectorAll('[data-done]').forEach(el=>el.onclick=e=>{ e.stopPropagation(); toggleDone(el.dataset.done); });
    document.querySelectorAll('[data-timer]').forEach(el=>el.onclick=e=>{ e.stopPropagation(); toggleTimer(el.dataset.timer); });
    document.querySelectorAll('[data-open]').forEach(el=>el.onclick=e=>{ e.stopPropagation(); openSheet(el.dataset.open); });
    document.querySelectorAll('[data-rowmenu]').forEach(el=>el.onclick=e=>{ e.stopPropagation(); openRowMenu(el.dataset.rowmenu,e); });

    // tree control bar
    const cb=document.getElementById('cvCollapse'); if(cb) cb.onclick=collapseAllTree;
    const cp=document.getElementById('cvProjects'); if(cp) cp.onclick=expandToProjects;
    const ce=document.getElementById('cvExpandAll'); if(ce) ce.onclick=expandAllTree;
    const bk=document.getElementById('cvBack'); if(bk) bk.onclick=()=>{ focusId=null; cam=null; render(); };

    // ideas
    const ia=document.getElementById('ideaAdd'), ii=document.getElementById('ideaInput');
    if(ia&&ii){ const add=()=>{ const v=ii.value.trim(); if(!v) return; const note={id:uid(),title:v,body:'',color:NOTE_COLORS[state.ideas.length%NOTE_COLORS.length],ts:new Date().toISOString()}; state.ideas.unshift(note); persist(); render(); ideaId=note.id; renderSheet(); }; ia.onclick=add; ii.onkeydown=e=>{ if(e.key==='Enter') add(); }; }
    document.querySelectorAll('[data-ideaopen]').forEach(el=>el.onclick=()=>{ ideaId=el.dataset.ideaopen; sheetId=null; settingsOpen=false; renderSheet(); });

    if(tab==='overview') wireCanvas();
    if(tab==='maps') wireMaps();
  }
  function focusAdd(id){ requestAnimationFrame(()=>{ const el=document.querySelector('[data-addinput="'+id+'"]'); if(el) el.focus(); }); }
  function openSheet(id){ settingsOpen=false; ideaId=null; searchOpen=false; mapNodeId=null; sheetId=id; renderSheet(); }
  function focusInTree(id){ focusId=id; tab='overview'; cam=null; sheetId=null; render(); }

  /* ---- Canvas interactions: pan, zoom, drag-to-reparent, add-menu ---- */
  function wireCanvas(){
    const vp=document.getElementById('cvViewport'), world=document.getElementById('cvWorld');
    if(!vp||!world) return;
    if(!cam){ fitCam(vp,world); }
    applyCam(world);

    document.getElementById('cvSelect').onclick=()=>{ selectMode=!selectMode; if(!selectMode) selected.clear(); render(); };
    document.getElementById('cvZoomIn').onclick=()=>{ zoomBy(1.2,vp,world); };
    document.getElementById('cvZoomOut').onclick=()=>{ zoomBy(1/1.2,vp,world); };
    document.getElementById('cvFit').onclick=()=>{ cam=null; fitCam(vp,world); applyCam(world); };
    document.getElementById('cvArrange').onclick=()=>{ if(confirm('Auto-arrange all nodes back into a tidy tree? This clears custom positions and sizes.')) autoArrange(); };

    // action buttons — stop pointer so a click doesn't start a drag
    document.querySelectorAll('[data-cvadd]').forEach(el=>el.onpointerdown=e=>e.stopPropagation());
    document.querySelectorAll('[data-cvadd]').forEach(el=>el.onclick=e=>{ e.stopPropagation(); openAddMenu(el.dataset.cvadd,e); });
    document.querySelectorAll('.cv-mini[data-exp],.cv-mini[data-timer],.cv-mini[data-open],.cv-ic[data-done]').forEach(el=>el.onpointerdown=e=>e.stopPropagation());

    // background: pan (normal) or marquee-select (select mode)
    vp.onpointerdown=e=>{
      if(pinching) return;
      if(e.target.closest('.cv-box')||e.target.closest('.cv-controls')) return;
      if(selectMode){ startMarquee(e,vp,world); return; }
      // pan
      const startX=e.clientX-cam.x, startY=e.clientY-cam.y; let moved=false;
      vp.setPointerCapture(e.pointerId);
      const move=ev=>{ if(pinching) return; moved=true; cam.x=ev.clientX-startX; cam.y=ev.clientY-startY; applyCam(world); };
      const up=()=>{ vp.removeEventListener('pointermove',move); vp.removeEventListener('pointerup',up); if(!moved && selected.size){ selected.clear(); render(); } };
      vp.addEventListener('pointermove',move); vp.addEventListener('pointerup',up);
    };
    vp.onwheel=e=>{ e.preventDefault(); zoomBy(e.deltaY<0?1.1:1/1.1,vp,world,e); };

    // ---- two-finger pinch-zoom + pan (touch) ----
    let pinch=null;
    const dist=(a,b)=>Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    vp.addEventListener('touchstart',e=>{
      if(e.touches.length>=2){
        pinching=true;
        const rect=vp.getBoundingClientRect();
        const a=e.touches[0], b=e.touches[1];
        const mx=(a.clientX+b.clientX)/2-rect.left, my=(a.clientY+b.clientY)/2-rect.top;
        pinch={ d0:dist(a,b), s0:cam.scale, midWorld:{ x:(mx-cam.x)/cam.scale, y:(my-cam.y)/cam.scale } };
      }
    },{passive:false});
    vp.addEventListener('touchmove',e=>{
      if(pinch && e.touches.length>=2){
        e.preventDefault();
        const rect=vp.getBoundingClientRect();
        const a=e.touches[0], b=e.touches[1];
        const mx=(a.clientX+b.clientX)/2-rect.left, my=(a.clientY+b.clientY)/2-rect.top;
        const s=Math.max(0.3,Math.min(1.8, pinch.s0*(dist(a,b)/pinch.d0)));
        cam.scale=s;
        cam.x=mx-pinch.midWorld.x*s;   // keep pinch centre anchored + follow finger drift = pan
        cam.y=my-pinch.midWorld.y*s;
        applyCam(world);
      }
    },{passive:false});
    const endPinch=e=>{ if(e.touches.length<2){ pinch=null; setTimeout(()=>{ pinching=false; },60); } };
    vp.addEventListener('touchend',endPinch);
    vp.addEventListener('touchcancel',endPinch);

    // resize handles
    document.querySelectorAll('[data-resize]').forEach(h=>{
      h.onpointerdown=e=>{
        e.stopPropagation();
        const id=h.dataset.resize, n=find(id).node;
        const nodeEl=h.closest('.cv-node'), boxEl=h.closest('.cv-box');
        const sx=e.clientX, sy=e.clientY, sw=getW(n), sh=getH(n);
        h.setPointerCapture(e.pointerId);
        const move=ev=>{
          const dw=(ev.clientX-sx)/cam.scale, dh=(ev.clientY-sy)/cam.scale;
          n.w=Math.max(MIN_W,Math.round(sw+dw)); n.h=Math.max(MIN_H,Math.round(sh+dh));
          nodeEl.style.width=n.w+'px'; boxEl.style.height=n.h+'px';
          const L=layout.find(x=>x.node.id===id); if(L){ /* size read via getW/getH */ }
          redrawLinks();
        };
        const up=()=>{ h.removeEventListener('pointermove',move); h.removeEventListener('pointerup',up); persist(); };
        h.addEventListener('pointermove',move); h.addEventListener('pointerup',up);
      };
    });

    // node body: drag (single or group) / tap (open or select-toggle)
    document.querySelectorAll('[data-cvopen]').forEach(box=>{
      box.onpointerdown=e=>{
        if(pinching) return;
        e.stopPropagation();
        const id=box.dataset.cvopen;
        const L=layout.find(x=>x.node.id===id); if(!L) return;
        const touch=e.pointerType==='touch';
        const threshold=touch?12:5;
        // which nodes move together
        const groupIds=(selected.has(id)&&selected.size>1)?[...selected]:[id];
        const snaps={}; groupIds.forEach(gid=>{ const gl=layout.find(x=>x.node.id===gid); if(gl) snaps[gid]={x:gl.x,y:gl.y}; });
        const p0=worldPoint(e,vp);
        const sx=e.clientX, sy=e.clientY; let dragging=false, suppressed=false;
        box.setPointerCapture(e.pointerId);
        const move=ev=>{
          if(pinching){ suppressed=true; if(dragging){ box.classList.remove('grabbing'); dragging=false; } return; }
          const dxs=ev.clientX-sx, dys=ev.clientY-sy;
          if(!dragging && Math.hypot(dxs,dys)>threshold){ dragging=true; box.classList.add('grabbing'); }
          if(dragging){
            const p=worldPoint(ev,vp); const dx=p.x-p0.x, dy=p.y-p0.y;
            groupIds.forEach(gid=>{
              const gl=layout.find(x=>x.node.id===gid); if(!gl||!snaps[gid]) return;
              gl.x=snaps[gid].x+dx; gl.y=snaps[gid].y+dy;
              const el=document.querySelector('.cv-node[data-node="'+gid+'"]');
              if(el){ el.style.left=gl.x+'px'; el.style.top=gl.y+'px'; }
            });
            redrawLinks();
          }
        };
        const up=ev=>{
          box.removeEventListener('pointermove',move); box.removeEventListener('pointerup',up);
          box.classList.remove('grabbing');
          if(dragging){
            groupIds.forEach(gid=>{ const gl=layout.find(x=>x.node.id===gid); const nn=find(gid); if(gl&&nn){ nn.node.x=Math.round(gl.x); nn.node.y=Math.round(gl.y); } });
            persist();
          } else if(!suppressed && !pinching){
            // tap
            if(selectMode || ev.shiftKey){ if(selected.has(id)) selected.delete(id); else selected.add(id); render(); }
            else openSheet(id);
          }
        };
        box.addEventListener('pointermove',move); box.addEventListener('pointerup',up);
      };
    });
  }

  function startMarquee(e,vp,world){
    const p0=worldPoint(e,vp);
    const box=document.createElement('div'); box.className='cv-marquee'; world.appendChild(box);
    vp.setPointerCapture(e.pointerId);
    const move=ev=>{
      const p=worldPoint(ev,vp);
      const x=Math.min(p0.x,p.x), y=Math.min(p0.y,p.y), w=Math.abs(p.x-p0.x), hh=Math.abs(p.y-p0.y);
      box.style.left=x+'px'; box.style.top=y+'px'; box.style.width=w+'px'; box.style.height=hh+'px';
    };
    const up=ev=>{
      vp.removeEventListener('pointermove',move); vp.removeEventListener('pointerup',up);
      const p=worldPoint(ev,vp);
      const rx1=Math.min(p0.x,p.x), ry1=Math.min(p0.y,p.y), rx2=Math.max(p0.x,p.x), ry2=Math.max(p0.y,p.y);
      selected.clear();
      layout.forEach(L=>{ const nx1=L.x,ny1=L.y,nx2=L.x+getW(L.node),ny2=L.y+getH(L.node);
        if(nx1<rx2&&nx2>rx1&&ny1<ry2&&ny2>ry1) selected.add(L.node.id); });
      box.remove(); render();
    };
    vp.addEventListener('pointermove',move); vp.addEventListener('pointerup',up);
  }

  // redraw connector paths in place during a drag (no full re-render)
  function redrawLinks(){
    const svg=document.querySelector('.cv-links'); if(!svg) return;
    let s='';
    layout.forEach(L=>{
      const kids=(L.node.type!=='task'&&L.node.expanded&&L.node.children)?L.node.children:[];
      kids.forEach(c=>{
        const cl=layout.find(x=>x.node===c); if(!cl) return;
        const x1=L.x+getW(L.node)/2, y1=L.y+getH(L.node), x2=cl.x+getW(c)/2, y2=cl.y, my=(y1+y2)/2;
        const col=statusColor(L.node);
        s+=`<path d="M${x1} ${y1} C ${x1} ${my}, ${x2} ${my}, ${x2} ${y2}" fill="none" stroke="${col}" stroke-opacity=".45" stroke-width="1.6"/>`;
        s+=`<circle cx="${x1}" cy="${y1}" r="3" fill="${col}"/><circle cx="${x2}" cy="${y2}" r="3" fill="${col}"/>`;
      });
    });
    svg.innerHTML=s;
  }
  function applyCam(world){ world.style.transform=`translate(${cam.x}px,${cam.y}px) scale(${cam.scale})`; }
  function fitCam(vp,world){
    const vw=vp.clientWidth, vh=vp.clientHeight;
    const ww=world.scrollWidth||world.offsetWidth, wh=world.scrollHeight||world.offsetHeight;
    const s=Math.min(vw/ww, vh/wh, 1)*0.94 || 1;
    cam={scale:Math.max(0.3,s), x:0, y:16};
    cam.x=(vw-ww*cam.scale)/2;
  }
  function zoomBy(f,vp,world,e){
    const prev=cam.scale; let s=Math.max(0.3,Math.min(1.8,prev*f));
    const rect=vp.getBoundingClientRect();
    const cx=e?e.clientX-rect.left:vp.clientWidth/2, cy=e?e.clientY-rect.top:vp.clientHeight/2;
    cam.x=cx-(cx-cam.x)*(s/prev); cam.y=cy-(cy-cam.y)*(s/prev); cam.scale=s;
    applyCam(world);
  }
  function worldPoint(e,vp){ const r=vp.getBoundingClientRect(); return {x:(e.clientX-r.left-cam.x)/cam.scale,y:(e.clientY-r.top-cam.y)/cam.scale}; }
  function autoArrange(){ walk(n=>{ delete n.x; delete n.y; delete n.w; delete n.h; }); selected.clear(); persist(); render(); }
  function openAddMenu(parentId,e){
    closeAddMenu();
    const m=document.createElement('div'); m.className='cv-addmenu'; m.id='cvAddMenu';
    m.innerHTML=`<button data-mk="task">${ICON.check} Task</button><button data-mk="event">${ICON.event} Event</button><button data-mk="deadline">${ICON.flag} Deadline</button><button data-mk="project">${ICON.box} Sub-project</button>`;
    document.body.appendChild(m);
    m.style.left=Math.min(e.clientX,window.innerWidth-170)+'px'; m.style.top=Math.min(e.clientY,window.innerHeight-190)+'px';
    m.querySelectorAll('button').forEach(b=>b.onclick=()=>{
      const mk=b.dataset.mk; closeAddMenu();
      const node = mk==='project' ? addChild(parentId,'New sub-project','project') : addChild(parentId,'New '+mk,'task',mk);
      if(node) openSheet(node.id);
    });
    setTimeout(()=>{ document.addEventListener('pointerdown',closeAddMenuOnce,{once:true}); },0);
  }
  function closeAddMenuOnce(e){ if(e.target.closest&&e.target.closest('#cvAddMenu')) return; closeAddMenu(); }
  function closeAddMenu(){ const m=document.getElementById('cvAddMenu'); if(m) m.remove(); }

  function wireSheet(n,f){
    const host=document.getElementById('sheetHost');
    const leaf=isLeaf(n);
    const close=()=>{ sheetId=null; renderSheet(); render(); };
    document.getElementById('scrim').onclick=e=>{ if(e.target.id==='scrim') close(); };
    const bk=document.getElementById('stBack'); if(bk) bk.onclick=close;
    const mn=document.getElementById('stMenu'); if(mn) mn.onclick=e=>{ e.stopPropagation(); openRowMenu(n.id,e); };
    const nm=document.getElementById('stName'); if(nm) nm.onchange=()=>{ const v=nm.value.trim(); if(v){ n.name=v; n.updatedAt=Date.now(); persist(); render(); } };
    const notes=document.getElementById('stNotes'); if(notes) notes.onchange=()=>{ n.notes=notes.value; n.updatedAt=Date.now(); persist(); };
    const del=document.getElementById('stDel'); if(del) del.onclick=()=>{ if(confirm('Delete "'+n.name+'"'+(n.children&&n.children.length?' and everything inside it':'')+'?')) remove(n.id); };
    const mv=document.getElementById('stMove'); if(mv) mv.onchange=()=>{ reparent(n.id, mv.value||null); };
    const fc=document.getElementById('stFocus'); if(fc) fc.onclick=()=>focusInTree(n.id);

    // items inside project sheet: open / done / rowmenu
    host.querySelectorAll('[data-open]').forEach(el=>el.onclick=e=>{ e.stopPropagation(); openSheet(el.dataset.open); });
    host.querySelectorAll('[data-done]').forEach(el=>el.onclick=e=>{ e.stopPropagation(); toggleDone(el.dataset.done); });
    host.querySelectorAll('[data-rowmenu]').forEach(el=>el.onclick=e=>{ e.stopPropagation(); openRowMenu(el.dataset.rowmenu,e); });
    host.querySelectorAll('[data-mkchild]').forEach(el=>el.onclick=()=>{ quickAdd(n.id, el.dataset.mkchild); });

    if(!leaf){
      document.querySelectorAll('[data-setstatus]').forEach(el=>el.onclick=()=>{ n.status=el.dataset.setstatus; n.updatedAt=Date.now(); persist(); renderSheet(); render(); });
      document.querySelectorAll('[data-color]').forEach(el=>el.onclick=()=>{ n.color=el.dataset.color; persist(); renderSheet(); render(); });
    } else {
      document.querySelectorAll('[data-setkind]').forEach(el=>el.onclick=()=>{ n.kind=el.dataset.setkind; n.updatedAt=Date.now(); persist(); renderSheet(); render(); });
      const dt=document.getElementById('stDate'); if(dt) dt.onchange=()=>{ n.dueDate=dt.value||null; n.updatedAt=Date.now(); persist(); render(); };
      const tm=document.getElementById('stTime'); if(tm) tm.onchange=()=>{ n.eventTime=tm.value.trim(); persist(); render(); };
      document.querySelectorAll('[data-setflow]').forEach(el=>el.onclick=()=>{ const v=el.dataset.setflow; if(n.flow!==v){ n.flow=v; n.flowSince=(v==='active')?null:new Date().toISOString(); } n.updatedAt=Date.now(); persist(); renderSheet(); render(); });
      const wf=document.getElementById('stWaitFor'); if(wf) wf.onchange=()=>{ n.waitingFor=wf.value.trim(); persist(); render(); };
      const bb=document.getElementById('stBlockBy'); if(bb) bb.onchange=()=>{ n.blockedBy=bb.value.trim(); persist(); render(); };
      document.querySelectorAll('[data-setrepeat]').forEach(el=>el.onclick=()=>{ n.repeat=el.dataset.setrepeat; persist(); renderSheet(); render(); });
      const tb=document.getElementById('stTimerBtn'); if(tb) tb.onclick=()=>{ toggleTimer(n.id); renderSheet(); render(); };
      const rs=document.getElementById('stReset'); if(rs) rs.onclick=()=>{ if(confirm('Reset logged time to zero?')){ n.timeSpent=0; n.timerRunning=false; n.timerStartedAt=null; persist(); renderSheet(); render(); } };
      const nx=document.getElementById('stNext'); if(nx) nx.onclick=()=>{ setNextAction(n.id); renderSheet(); };
      const cal=document.getElementById('stCal'); if(cal) cal.onclick=()=>addToCalendar(n);
    }
  }

  function startTick(){
    if(tick) clearInterval(tick);
    tick=setInterval(()=>{
      const r=runningTask(); if(!r) return;
      const ls=liveSecs(r);
      document.querySelectorAll('[data-live="'+r.id+'"]').forEach(el=>el.textContent=fmtClock(ls));
      const cap=document.querySelector('[data-live-cap="'+r.id+'"]'); if(cap){ const d=dueMeta(r.dueDate); const b=[]; if(d)b.push(d.label); if(r.repeat&&r.repeat!=='none')b.push('↻'+r.repeat); b.push(fmtClock(ls)); cap.textContent=b.join(' · '); }
      const st=document.getElementById('stTimer'); if(st&&sheetId===r.id) st.textContent=fmtClock(ls);
    },1000);
  }

  load();
})();
</script>
</body>
</html>
