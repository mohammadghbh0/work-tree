<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Work Tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12131A; --panel:#1A1C25; --panel-2:#22252F; --line:#2C303B;
    --ink:#ECEDF1; --dim:#9096A5; --faint:#636A79;
    --accent:#6E8BEF;
    --ok:#4FBF8B; --warn:#E7B84E; --late:#EF6461; --idea:#C98BE0;
    --f-disp:'Fraunces',Georgia,serif;
    --f-body:'Inter',system-ui,-apple-system,sans-serif;
    --f-mono:'JetBrains Mono',monospace;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  button svg{ width:16px; height:16px; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--ink); font-family:var(--f-body); font-size:15px; -webkit-font-smoothing:antialiased; }
  @media (prefers-reduced-motion:reduce){ *{ transition:none!important; animation:none!important; } }

  .app{ max-width:100%; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }

  header{ padding:16px 16px 0; }
  .brand{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .brand h1{ font-family:var(--f-disp); font-weight:600; font-size:22px; margin:0; letter-spacing:-.01em; }
  .brand h1 .leaf{ color:var(--accent); }
  .save-state{ font-family:var(--f-mono); font-size:10.5px; color:var(--faint); letter-spacing:.04em; }

  .tabs{ display:flex; gap:2px; margin-top:14px; border-bottom:1px solid var(--line); }
  .tab{ flex:1; background:none; border:none; color:var(--dim); font-family:var(--f-body); font-size:13.5px; font-weight:500; padding:10px 4px 12px; cursor:pointer; position:relative; }
  .tab.active{ color:var(--ink); }
  .tab.active::after{ content:''; position:absolute; left:0; right:0; bottom:-1px; height:2px; background:var(--accent); border-radius:2px 2px 0 0; }
  .tab .count{ display:inline-block; min-width:16px; font-size:11px; font-family:var(--f-mono); color:var(--faint); }

  main{ flex:1; padding:16px; }

  /* ---------- OVERVIEW / TREE ---------- */
  .tree-scroll{ overflow:auto; padding:8px 4px 20px; -webkit-overflow-scrolling:touch; }
  svg.tree{ display:block; }
  .legend{ display:flex; gap:14px; flex-wrap:wrap; margin:0 0 6px; padding:0 4px; }
  .legend span{ display:flex; align-items:center; gap:6px; font-size:11.5px; color:var(--dim); font-family:var(--f-mono); }
  .legend i{ width:9px; height:9px; border-radius:50%; display:inline-block; }
  .hint{ color:var(--faint); font-size:12px; padding:2px 4px 0; }

  /* ---------- LISTS (projects / todo / ideas) ---------- */
  .row{ display:flex; align-items:flex-start; gap:10px; padding:11px 12px; border-radius:12px; background:var(--panel); border:1px solid transparent; margin-bottom:8px; }
  .row.nested{ margin-left:18px; }
  .row .caret{ background:none; border:none; color:var(--faint); cursor:pointer; padding:2px; margin-top:1px; display:flex; transition:transform .15s; flex-shrink:0; }
  .row .caret.open{ transform:rotate(90deg); }
  .row .caret.hidden{ visibility:hidden; }
  .node-dot{ width:10px; height:10px; border-radius:50%; flex-shrink:0; margin-top:5px; }
  .check{ width:18px; height:18px; border-radius:6px; border:1.6px solid var(--faint); flex-shrink:0; margin-top:1px; cursor:pointer; display:flex; align-items:center; justify-content:center; background:none; color:var(--bg); padding:0; }
  .check.on{ background:var(--ok); border-color:var(--ok); }
  .grow{ flex:1; min-width:0; cursor:pointer; }
  .title{ font-weight:500; font-size:14.5px; line-height:1.3; }
  .row.lvl0 .title{ font-family:var(--f-disp); font-weight:600; font-size:16px; }
  .title.done{ color:var(--faint); text-decoration:line-through; }
  .sub{ display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-top:4px; font-family:var(--f-mono); font-size:11.5px; color:var(--dim); }
  .pill{ padding:2px 7px; border-radius:6px; background:var(--panel-2); }
  .pill.late{ color:var(--late); background:#2A1B1C; }
  .pill.today{ color:var(--warn); background:#2A2416; }
  .pill.run{ color:var(--accent); background:#1C2338; }
  .dotsep{ color:var(--faint); }
  .row-actions{ display:flex; gap:2px; flex-shrink:0; }
  .ibtn{ background:none; border:none; color:var(--faint); cursor:pointer; padding:6px; border-radius:8px; display:flex; }
  .ibtn:hover{ color:var(--ink); background:var(--panel-2); }
  .ibtn.play{ color:var(--accent); }
  .ibtn.play.on{ background:#1C2338; }
  .ibtn svg{ width:15px; height:15px; }

  .addbar{ display:flex; gap:8px; margin-top:6px; }
  .addbar input{ flex:1; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 12px; color:var(--ink); font-family:var(--f-body); font-size:14px; }
  .addbar input:focus{ outline:none; border-color:var(--accent); }
  .addbar button, .add-inline{ border:none; border-radius:10px; padding:0 14px; background:var(--accent); color:#0E1018; font-weight:600; font-size:14px; cursor:pointer; font-family:var(--f-body); }
  .add-inline{ padding:9px 12px; background:var(--panel); color:var(--dim); border:1px dashed var(--line); margin:2px 0 10px; font-weight:500; display:inline-flex; align-items:center; gap:6px; }
  .add-inline:hover{ color:var(--ink); border-color:var(--faint); }
  .add-inline.block{ display:flex; width:100%; justify-content:center; }

  .section-label{ font-family:var(--f-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); margin:18px 4px 8px; }
  .empty{ text-align:center; color:var(--faint); font-size:13px; padding:34px 12px; line-height:1.6; }

  /* ---------- DETAIL SHEET ---------- */
  .scrim{ position:fixed; inset:0; background:rgba(8,9,13,.62); display:flex; align-items:flex-end; justify-content:center; z-index:40; }
  .sheet{ background:var(--panel); width:100%; max-width:720px; border-radius:20px 20px 0 0; border-top:1px solid var(--line); max-height:88vh; overflow:auto; padding:8px 18px 26px; }
  @media(min-width:600px){ .scrim{ align-items:center; } .sheet{ border-radius:18px; max-height:82vh; } }
  .grabber{ width:38px; height:4px; border-radius:2px; background:var(--line); margin:8px auto 14px; }
  .sheet-head{ display:flex; align-items:flex-start; gap:10px; margin-bottom:6px; }
  .sheet-dot{ width:12px; height:12px; border-radius:50%; margin-top:7px; flex-shrink:0; }
  .sheet-title{ font-family:var(--f-disp); font-weight:600; font-size:20px; border:none; background:none; color:var(--ink); width:100%; padding:2px 0; }
  .sheet-title:focus{ outline:none; border-bottom:1px solid var(--accent); }
  .kind-tag{ font-family:var(--f-mono); font-size:11px; color:var(--faint); letter-spacing:.05em; margin-bottom:16px; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-family:var(--f-mono); font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--faint); margin-bottom:7px; }
  .field input[type=date], .field select, .field textarea{ width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; color:var(--ink); font-family:var(--f-body); font-size:14px; color-scheme:dark; }
  .field textarea{ min-height:84px; resize:vertical; line-height:1.6; }
  .field input:focus, .field select:focus, .field textarea:focus{ outline:none; border-color:var(--accent); }

  .timer-box{ display:flex; align-items:center; gap:12px; background:var(--panel-2); border:1px solid var(--line); border-radius:12px; padding:12px 14px; }
  .timer-read{ font-family:var(--f-mono); font-size:22px; font-weight:500; letter-spacing:.02em; }
  .timer-read.running{ color:var(--accent); }
  .timer-btn{ margin-left:auto; border:none; border-radius:9px; padding:9px 16px; font-family:var(--f-body); font-size:13.5px; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:7px; }
  .timer-btn.start{ background:var(--accent); color:#0E1018; }
  .timer-btn.stop{ background:#2A1B1C; color:var(--late); }
  .timer-reset{ background:none; border:none; color:var(--faint); font-size:12px; cursor:pointer; font-family:var(--f-mono); }

  .status-row{ display:flex; gap:8px; }
  .status-opt{ flex:1; text-align:center; padding:9px 4px; border-radius:10px; border:1px solid var(--line); background:var(--panel-2); color:var(--dim); font-size:12.5px; cursor:pointer; }
  .status-opt.sel{ color:var(--ink); border-width:1.5px; }
  .status-opt.sel[data-s=active]{ border-color:var(--accent); }
  .status-opt.sel[data-s=done]{ border-color:var(--ok); }
  .status-opt.sel[data-s=hold]{ border-color:var(--warn); }

  .sheet-foot{ display:flex; gap:10px; margin-top:22px; }
  .btn{ border:none; border-radius:11px; padding:12px; font-family:var(--f-body); font-size:14px; font-weight:600; cursor:pointer; flex:1; display:inline-flex; align-items:center; justify-content:center; gap:7px; }
  .btn svg{ width:16px; height:16px; flex-shrink:0; }
  .add-inline svg{ width:15px; height:15px; flex-shrink:0; }
  .addbar button svg{ width:16px; height:16px; }
  .btn.cal{ background:var(--panel-2); color:var(--ink); border:1px solid var(--line); }
  .btn.del{ background:none; color:var(--late); border:1px solid #3A2626; flex:0 0 auto; padding:12px 16px; }
  .swatches{ display:flex; gap:9px; }
  .sw{ width:28px; height:28px; border-radius:50%; cursor:pointer; border:2px solid transparent; }
  .sw.sel{ border-color:var(--ink); }

  .loading{ text-align:center; color:var(--faint); font-family:var(--f-mono); font-size:12px; padding:60px; }

  /* ===== COMMAND CENTER ===== */
  .cc-strip{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:10px; }
  .cc-stat{ background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 10px 10px; text-align:center; position:relative; overflow:hidden; }
  .cc-stat::before{ content:''; position:absolute; top:0; left:0; right:0; height:2px; background:var(--line); }
  .cc-stat.alert::before{ background:var(--late); }
  .cc-stat.warnc::before{ background:var(--warn); }
  .cc-num{ display:block; font-family:var(--f-disp); font-weight:600; font-size:24px; line-height:1; letter-spacing:-.02em; }
  .cc-stat.alert .cc-num{ color:var(--late); }
  .cc-stat.warnc .cc-num{ color:var(--warn); }
  .cc-lab{ display:block; font-family:var(--f-mono); font-size:9.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); margin-top:5px; }

  .cc-run{ display:flex; align-items:center; gap:9px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:11px 14px; margin-bottom:16px; }
  .cc-run.live{ border-color:#33406B; background:linear-gradient(90deg,#1A2032,var(--panel)); cursor:pointer; }
  .cc-run-dot{ width:8px; height:8px; border-radius:50%; background:var(--faint); flex-shrink:0; }
  .cc-run.live .cc-run-dot{ background:var(--accent); animation:pulse 1.5s infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.3;} }
  .cc-run-label{ font-family:var(--f-mono); font-size:10px; letter-spacing:.12em; color:var(--faint); }
  .cc-run.live .cc-run-label{ color:var(--accent); }
  .cc-run-task{ font-family:var(--f-mono); font-size:11.5px; color:var(--dim); margin-left:auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  /* ===== NODE CANVAS ===== */
  .cv-viewport{ position:relative; height:72vh; min-height:460px; background:radial-gradient(circle at 1px 1px, #23262F 1px, transparent 0) 0 0/22px 22px, var(--bg); border:1px solid var(--line); border-radius:16px; overflow:hidden; touch-action:none; cursor:grab; }
  .cv-viewport:active{ cursor:grabbing; }
  .cv-world{ position:absolute; top:0; left:0; transform-origin:0 0; will-change:transform; }
  .cv-links{ position:absolute; top:0; left:0; overflow:visible; pointer-events:none; }

  .cv-node{ position:absolute; }
  .cv-box{ display:flex; align-items:center; gap:9px; height:50px; padding:0 8px 0 9px; background:var(--panel); border:1px solid var(--line); border-radius:13px; cursor:grab; box-shadow:0 4px 14px rgba(0,0,0,.28); position:relative; }
  .cv-box:active{ cursor:grabbing; }
  .cv-box.grabbing{ cursor:grabbing; border-color:var(--accent); box-shadow:0 0 0 2px var(--accent), 0 10px 26px rgba(0,0,0,.5); }
  .cv-node:has(.grabbing){ z-index:20; }
  .cv-node.sel .cv-box{ border-color:var(--accent); box-shadow:0 0 0 2px var(--accent); }
  .cv-resize{ position:absolute; right:2px; bottom:2px; width:14px; height:14px; cursor:nwse-resize; border-radius:0 0 10px 0; opacity:0; }
  .cv-resize::after{ content:''; position:absolute; right:3px; bottom:3px; width:7px; height:7px; border-right:2px solid var(--faint); border-bottom:2px solid var(--faint); }
  .cv-box:hover .cv-resize, .cv-node.sel .cv-resize{ opacity:1; }
  .cv-marquee{ position:absolute; border:1.5px solid var(--accent); background:color-mix(in srgb,var(--accent) 14%,transparent); border-radius:6px; pointer-events:none; z-index:15; }
  .cv-box::after{ content:''; position:absolute; left:0; top:12px; bottom:12px; width:3px; border-radius:3px; background:var(--c); }
  .cv-box.drop{ border-color:var(--accent); box-shadow:0 0 0 2px var(--accent), 0 4px 14px rgba(0,0,0,.4); }
  .cv-node.branch .cv-box{ background:linear-gradient(180deg,var(--panel-2),var(--panel)); }

  .cv-ic{ width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-left:4px; }
  .cv-ic.branch{ background:color-mix(in srgb,var(--c) 20%,var(--panel-2)); color:var(--c); }
  .cv-ic.branch svg{ width:15px; height:15px; }
  .cv-ic.task{ width:20px; height:20px; border-radius:6px; border:1.7px solid var(--c); color:#0E1018; cursor:pointer; }
  .cv-ic.task.done{ background:var(--c); }
  .cv-ic.task svg{ width:12px; height:12px; }
  .cv-title{ flex:1; min-width:0; font-family:var(--f-body); font-weight:600; font-size:13px; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .cv-node.branch .cv-title{ font-family:var(--f-disp); }
  .cv-acts{ display:flex; gap:1px; flex-shrink:0; }
  .cv-mini{ width:24px; height:24px; border:none; background:none; color:var(--faint); border-radius:6px; cursor:pointer; display:flex; align-items:center; justify-content:center; font-family:var(--f-mono); font-size:14px; }
  .cv-mini:hover{ color:var(--ink); background:var(--panel-2); }
  .cv-mini.play{ color:var(--accent); }
  .cv-mini.play.on{ background:#1C2338; }
  .cv-mini svg{ width:13px; height:13px; }
  .cv-cap{ text-align:center; font-family:var(--f-mono); font-size:9.5px; color:var(--dim); margin-top:6px; padding:0 4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .cv-controls{ position:absolute; right:12px; bottom:12px; display:flex; flex-direction:column; gap:6px; z-index:5; }
  .cv-controls button{ width:34px; height:34px; border-radius:9px; border:1px solid var(--line); background:var(--panel); color:var(--ink); font-size:17px; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(0,0,0,.3); }
  .cv-controls button.active{ background:var(--accent); color:#0E1018; border-color:var(--accent); }
  .cv-controls button:hover{ background:var(--panel-2); }
  .cv-hint{ position:absolute; left:12px; bottom:12px; font-family:var(--f-mono); font-size:10px; color:var(--faint); background:color-mix(in srgb,var(--bg) 70%,transparent); padding:5px 9px; border-radius:7px; z-index:5; }

  .cv-ghost{ position:fixed; transform:translate(-50%,-50%); background:var(--accent); color:#0E1018; font-family:var(--f-body); font-weight:600; font-size:12.5px; padding:7px 12px; border-radius:9px; pointer-events:none; z-index:60; box-shadow:0 6px 20px rgba(0,0,0,.5); white-space:nowrap; }
  .cv-addmenu{ position:fixed; z-index:60; background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:5px; box-shadow:0 10px 30px rgba(0,0,0,.5); display:flex; flex-direction:column; gap:2px; min-width:150px; }
  .cv-addmenu button{ display:flex; align-items:center; gap:9px; background:none; border:none; color:var(--ink); font-family:var(--f-body); font-size:13.5px; padding:9px 11px; border-radius:8px; cursor:pointer; text-align:left; }
  .cv-addmenu button:hover{ background:var(--panel-2); }
  .cv-addmenu button svg{ width:15px; height:15px; color:var(--dim); }

  .field select{ width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; color:var(--ink); font-family:var(--f-body); font-size:14px; }

  /* ===== STICKY NOTES ===== */
  .notes-wall{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:12px; }
  @media(min-width:560px){ .notes-wall{ grid-template-columns:repeat(3,1fr); } }
  @media(min-width:900px){ .notes-wall{ grid-template-columns:repeat(4,1fr); } }
  @media(min-width:1300px){ .notes-wall{ grid-template-columns:repeat(6,1fr); } }
  .note{ background:var(--panel); border:1px solid var(--line); border-top:3px solid var(--nc); border-radius:12px; padding:13px 13px 10px; cursor:pointer; min-height:104px; display:flex; flex-direction:column; transition:transform .12s, border-color .12s; }
  .note:hover{ transform:translateY(-2px); border-color:var(--nc); }
  .note-title{ font-family:var(--f-disp); font-weight:600; font-size:14.5px; line-height:1.25; color:var(--ink); margin-bottom:6px; }
  .note-preview{ font-size:12px; line-height:1.5; color:var(--dim); flex:1; overflow:hidden; }
  .note-empty{ color:var(--faint); font-style:italic; }
  .note-foot{ font-family:var(--f-mono); font-size:9.5px; color:var(--faint); margin-top:8px; letter-spacing:.05em; }

  /* ===== STATUS BADGES ===== */
  .badge{ font-family:var(--f-mono); font-size:8.5px; letter-spacing:.08em; padding:2px 6px; border-radius:5px; font-weight:600; white-space:nowrap; border:1px solid transparent; }
  .b-active{ color:var(--accent); background:color-mix(in srgb,var(--accent) 14%,transparent); }
  .b-hold{ color:var(--warn); background:color-mix(in srgb,var(--warn) 14%,transparent); }
  .b-wait{ color:var(--warn); background:color-mix(in srgb,var(--warn) 14%,transparent); }
  .b-block{ color:var(--late); background:color-mix(in srgb,var(--late) 15%,transparent); }
  .b-done{ color:var(--ok); background:color-mix(in srgb,var(--ok) 14%,transparent); }
  .b-next{ color:#0E1018; background:var(--accent); }

  /* ===== TREE control bar + focus ===== */
  .tree-bar{ display:flex; gap:7px; margin:2px 0 10px; flex-wrap:wrap; }
  .tbtn{ background:var(--panel); border:1px solid var(--line); color:var(--dim); border-radius:9px; padding:7px 11px; font-size:12px; font-family:var(--f-body); cursor:pointer; min-height:34px; }
  .tbtn:hover{ color:var(--ink); border-color:var(--faint); }
  .focus-bar{ display:flex; align-items:center; gap:10px; background:color-mix(in srgb,var(--accent) 12%,var(--panel)); border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line)); border-radius:11px; padding:8px 10px; margin-bottom:10px; }
  .focus-back{ display:inline-flex; align-items:center; gap:5px; background:var(--accent); color:#0E1018; border:none; border-radius:8px; padding:7px 11px; font-size:12.5px; font-weight:600; cursor:pointer; }
  .focus-back svg{ width:14px; height:14px; }
  .focus-name{ font-size:12.5px; color:var(--ink); font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* node status badge */
  .cv-badge{ font-family:var(--f-mono); font-size:7.5px; letter-spacing:.04em; padding:2px 4px; border-radius:4px; font-weight:600; flex-shrink:0; }
  .cv-ic.kind{ background:color-mix(in srgb,var(--c) 18%,var(--panel-2)); color:var(--c); }
  .cv-ic.kind svg{ width:14px; height:14px; }

  /* ===== PROJECT ROWS (mobile-first) ===== */
  .plist{ margin-top:6px; }
  .prow{ display:flex; align-items:center; gap:9px; padding:9px 8px; border-radius:11px; position:relative; min-height:52px; }
  .prow:hover{ background:var(--panel); }
  .prow.branch{ background:var(--panel); border:1px solid var(--line); margin-bottom:5px; }
  .prow.leaf{ margin-bottom:1px; }
  .prow.dl1, .prow.dl2, .prow.dl3{ border-left:2px solid var(--line); border-radius:0 11px 11px 0; margin-left:6px; }
  .prow .caret{ background:none; border:none; color:var(--faint); cursor:pointer; padding:4px; display:flex; transition:transform .15s; flex-shrink:0; min-width:30px; min-height:30px; align-items:center; justify-content:center; }
  .prow .caret.open{ transform:rotate(90deg); }
  .prow .caret.hidden{ visibility:hidden; }
  .prow .caret svg{ width:15px; height:15px; }
  .pkind{ width:30px; min-height:30px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .pkind svg{ width:16px; height:16px; }
  .pmain{ flex:1; min-width:0; background:none; border:none; text-align:left; cursor:pointer; padding:4px 0; display:flex; flex-direction:column; gap:3px; }
  .ptitle-row{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
  .ptitle{ font-size:14.5px; color:var(--ink); font-weight:500; line-height:1.25; }
  .prow.branch .ptitle{ font-family:var(--f-disp); font-weight:600; font-size:15px; }
  .ptitle.done{ text-decoration:line-through; color:var(--faint); }
  .psub{ font-size:12px; color:var(--dim); line-height:1.35; overflow:hidden; text-overflow:ellipsis; }
  .prun{ font-family:var(--f-mono); font-size:11px; color:var(--accent); background:#1C2338; padding:3px 7px; border-radius:6px; flex-shrink:0; }
  .pmenu{ background:none; border:none; color:var(--faint); cursor:pointer; width:38px; height:38px; border-radius:9px; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
  .pmenu:hover{ color:var(--ink); background:var(--panel-2); }
  .pmenu svg{ width:18px; height:18px; }
  .more-note{ font-size:12px; color:var(--faint); padding:4px 8px 8px; }

  .cv-addmenu button.danger{ color:var(--late); }

  /* ===== FULL-SCREEN SHEET ===== */
  .sheet.full{ max-width:640px; width:100%; max-height:94vh; padding:0; display:flex; flex-direction:column; }
  @media(max-width:600px){ .sheet.full{ max-height:100vh; height:100vh; border-radius:0; } .scrim:has(.sheet.full){ align-items:stretch; } }
  .sheet-top{ display:flex; align-items:flex-start; gap:8px; padding:14px 14px 12px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--panel); z-index:2; border-radius:20px 20px 0 0; }
  @media(max-width:600px){ .sheet-top{ border-radius:0; padding-top:calc(14px + env(safe-area-inset-top,0)); } }
  .sheet-back, .sheet-menu{ background:var(--panel-2); border:1px solid var(--line); color:var(--ink); border-radius:10px; width:38px; height:38px; flex-shrink:0; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .sheet-back svg{ width:18px; height:18px; } .sheet-menu svg{ width:18px; height:18px; }
  .sheet-top-mid{ flex:1; min-width:0; }
  .sheet-tagline{ display:flex; align-items:center; gap:8px; margin-top:2px; }
  .kind-tag2{ font-family:var(--f-mono); font-size:10px; color:var(--faint); letter-spacing:.08em; }
  .sheet-body{ padding:14px 16px calc(30px + env(safe-area-inset-bottom,0)); overflow:auto; flex:1; }
  .crumbs{ font-family:var(--f-mono); font-size:10.5px; color:var(--faint); margin-bottom:5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .crumb{ color:var(--dim); cursor:pointer; } .crumb:hover{ color:var(--ink); text-decoration:underline; } .crumb-sep{ opacity:.5; }
  .sheet.full .sheet-head{ margin-bottom:0; }
  .sheet-notes{ width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:10px 12px; color:var(--ink); font-family:var(--f-body); font-size:14px; min-height:70px; resize:vertical; line-height:1.6; }
  .sheet-notes:focus{ outline:none; border-color:var(--accent); }

  /* overview cards inside project sheet */
  .ov-cards{ display:flex; flex-direction:column; gap:10px; margin-bottom:6px; }
  .ov-next{ text-align:left; background:color-mix(in srgb,var(--accent) 10%,var(--panel-2)); border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line)); border-radius:13px; padding:12px 14px; cursor:pointer; display:flex; flex-direction:column; gap:4px; }
  .ov-next.empty{ background:var(--panel-2); border-style:dashed; cursor:default; }
  .ov-k{ font-family:var(--f-mono); font-size:10px; letter-spacing:.1em; color:var(--accent); }
  .ov-next.empty .ov-k{ color:var(--faint); }
  .ov-v{ font-size:15.5px; color:var(--ink); font-weight:600; font-family:var(--f-disp); }
  .ov-v.dim{ color:var(--faint); font-weight:400; font-family:var(--f-body); font-size:14px; }
  .ov-stats{ display:grid; grid-template-columns:repeat(5,1fr); gap:6px; }
  .ov-s{ background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:9px 4px; text-align:center; display:flex; flex-direction:column; gap:2px; }
  .ov-s b{ font-size:17px; color:var(--ink); font-weight:600; } .ov-s span{ font-size:9.5px; color:var(--faint); font-family:var(--f-mono); letter-spacing:.03em; }
  .ov-s.bad b{ color:var(--late); } .ov-s.warn b{ color:var(--warn); }
  .ov-line{ display:flex; align-items:center; gap:9px; background:var(--panel-2); border:1px solid var(--line); border-radius:10px; padding:11px 13px; cursor:pointer; color:var(--dim); font-size:12.5px; font-family:var(--f-mono); text-align:left; width:100%; }
  .ov-line svg{ width:15px; height:15px; flex-shrink:0; color:var(--dim); }
  .ov-line span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .items{ display:flex; flex-direction:column; }
  .sheet-item{ border-bottom:1px solid var(--line); }
  .add-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-top:12px; }
  .add-chip{ display:flex; align-items:center; justify-content:center; gap:7px; background:var(--panel-2); border:1px solid var(--line); color:var(--ink); border-radius:11px; padding:12px; font-size:13px; font-family:var(--f-body); font-weight:500; cursor:pointer; min-height:46px; }
  .add-chip:hover{ border-color:var(--accent); } .add-chip svg{ width:15px; height:15px; color:var(--dim); }

  .settings-fold{ margin-top:20px; border-top:1px solid var(--line); padding-top:8px; }
  .settings-fold summary{ font-family:var(--f-mono); font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); cursor:pointer; padding:8px 2px; list-style:none; }
  .settings-fold summary::-webkit-details-marker{ display:none; }
  .settings-fold summary::before{ content:'⚙ '; }
  .settings-fold[open] summary{ color:var(--dim); }
  .status-row.wrap{ flex-wrap:wrap; } .status-row.wrap .status-opt{ flex:1 1 28%; }
  .status-opt.sel{ border-color:var(--accent); color:var(--ink); }

  /* ===== SEARCH ===== */
  .search-input{ width:100%; background:var(--panel-2); border:1px solid var(--line); border-radius:11px; padding:12px 14px; color:var(--ink); font-family:var(--f-body); font-size:15px; }
  .search-input:focus{ outline:none; border-color:var(--accent); }
  .sr-row{ display:flex; align-items:center; gap:8px; border-bottom:1px solid var(--line); }
  .sr-main{ flex:1; min-width:0; background:none; border:none; text-align:left; cursor:pointer; padding:12px 2px; display:flex; flex-direction:column; gap:3px; }
  .sr-name{ font-size:14.5px; color:var(--ink); font-weight:500; }
  .sr-trail{ font-family:var(--f-mono); font-size:11px; color:var(--faint); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .sr-meta{ font-family:var(--f-mono); font-size:10px; color:var(--dim); letter-spacing:.06em; }
  .sr-focus{ background:var(--panel-2); border:1px solid var(--line); color:var(--dim); border-radius:9px; width:38px; height:38px; flex-shrink:0; display:flex; align-items:center; justify-content:center; cursor:pointer; }
  .sr-focus:hover{ color:var(--accent); border-color:var(--accent); } .sr-focus svg{ width:16px; height:16px; }

  /* ===== MIND MAPS ===== */
  .map-gallery{ display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:12px; }
  @media(min-width:560px){ .map-gallery{ grid-template-columns:repeat(3,1fr); } }
  @media(min-width:900px){ .map-gallery{ grid-template-columns:repeat(4,1fr); } }
  .map-card{ position:relative; text-align:left; background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--mc); border-radius:13px; padding:15px 14px 13px; cursor:pointer; min-height:96px; display:flex; flex-direction:column; gap:6px; }
  .map-card:hover{ border-color:var(--mc); }
  .map-card-title{ font-family:var(--f-disp); font-weight:600; font-size:15.5px; color:var(--ink); line-height:1.25; padding-right:24px; }
  .map-card-meta{ font-family:var(--f-mono); font-size:10.5px; color:var(--faint); letter-spacing:.04em; margin-top:auto; }
  .map-card-menu{ position:absolute; top:8px; right:6px; width:30px; height:30px; display:flex; align-items:center; justify-content:center; color:var(--faint); border-radius:8px; }
  .map-card-menu:hover{ color:var(--ink); background:var(--panel-2); } .map-card-menu svg{ width:16px; height:16px; }

  .map-top{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .map-name{ flex:1; min-width:0; background:var(--panel-2); border:1px solid var(--line); border-radius:9px; padding:8px 11px; color:var(--ink); font-family:var(--f-disp); font-weight:600; font-size:15px; }
  .map-name:focus{ outline:none; border-color:var(--accent); }

  .map-node{ position:absolute; transform:translate(-50%,-50%); display:flex; align-items:center; }
  .map-node-body{ background:var(--panel); border:1.5px solid var(--mc); color:var(--ink); border-radius:20px; padding:9px 15px; font-size:13.5px; font-weight:500; max-width:200px; box-shadow:0 3px 12px rgba(0,0,0,.3); cursor:grab; white-space:normal; text-align:center; line-height:1.3; }
  .map-node-body.sized{ width:var(--mw); max-width:none; }
  .map-node.root .map-node-body{ background:linear-gradient(180deg,color-mix(in srgb,var(--mc) 26%,var(--panel)),var(--panel)); border-width:2px; font-family:var(--f-disp); font-weight:600; font-size:15px; padding:11px 18px; }
  .map-node.grabbing .map-node-body{ cursor:grabbing; box-shadow:0 0 0 2px var(--mc),0 8px 22px rgba(0,0,0,.5); }
  .map-node.sel .map-node-body{ box-shadow:0 0 0 2px var(--accent),0 4px 14px rgba(0,0,0,.4); border-color:var(--accent); }
  .map-add{ width:22px; height:22px; border-radius:50%; border:none; background:var(--mc); color:#0E1018; cursor:pointer; display:flex; align-items:center; justify-content:center; margin-left:-8px; opacity:0; transition:opacity .12s; flex-shrink:0; box-shadow:0 2px 6px rgba(0,0,0,.4); }
  .map-node:hover .map-add, .map-node.root .map-add{ opacity:1; }
  .map-add svg{ width:13px; height:13px; }
  @media(hover:none){ .map-add{ opacity:1; } }
  .map-resize{ position:absolute; right:-5px; bottom:-5px; width:16px; height:16px; border-radius:50%; background:var(--panel-2); border:1.5px solid var(--mc); cursor:nwse-resize; opacity:0; transition:opacity .12s; }
  .map-resize::after{ content:''; position:absolute; inset:4px; border-right:2px solid var(--mc); border-bottom:2px solid var(--mc); }
  .map-node:hover .map-resize{ opacity:1; }
  @media(hover:none){ .map-resize{ opacity:.85; } }
  .map-note{ position:absolute; left:100%; top:50%; transform:translateY(-50%); margin-left:10px; max-width:170px; font-size:11px; line-height:1.35; color:var(--dim); background:color-mix(in srgb,var(--warn) 8%,var(--panel)); border:1px dashed color-mix(in srgb,var(--warn) 40%,var(--line)); border-radius:8px; padding:5px 8px; pointer-events:none; white-space:normal; text-align:left; }
  .map-selbar{ position:absolute; left:50%; bottom:52px; transform:translateX(-50%); display:flex; align-items:center; gap:8px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:7px 8px 7px 13px; box-shadow:0 6px 20px rgba(0,0,0,.4); z-index:6; }
  .map-selbar span{ font-size:12.5px; color:var(--dim); font-family:var(--f-mono); }
  .map-selbar button{ background:var(--accent); color:#0E1018; border:none; border-radius:8px; padding:7px 11px; font-size:12.5px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:5px; }
  .map-selbar button#mapSelClear{ background:var(--panel-2); color:var(--dim); }
  .map-selbar button svg{ width:13px; height:13px; }
  .map-empty-add{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); background:var(--accent); color:#0E1018; border:none; border-radius:11px; padding:12px 18px; font-weight:600; font-size:14px; cursor:pointer; display:flex; align-items:center; gap:7px; z-index:4; }
  .map-empty-add svg{ width:16px; height:16px; }
</style>
