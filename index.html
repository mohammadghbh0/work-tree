<body>
<div class="app">
  <header>
    <div class="brand">
      <h1>Work&nbsp;<span class="leaf">Tree</span></h1>
      <span style="display:flex;align-items:center;gap:6px;">
        <span class="save-state" id="saveState">synced</span>
        <button id="searchBtn" title="Search everything" style="background:none;border:none;color:var(--faint);cursor:pointer;padding:6px;display:flex;">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </button>
        <button id="settingsBtn" title="Settings & sync" style="background:none;border:none;color:var(--faint);cursor:pointer;padding:6px;display:flex;">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </span>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab active" data-tab="overview">Tree</button>
      <button class="tab" data-tab="today">Today <span class="count" id="todoCount"></span></button>
      <button class="tab" data-tab="projects">Projects</button>
      <button class="tab" data-tab="maps">Maps</button>
      <button class="tab" data-tab="ideas">Ideas</button>
    </nav>
  </header>
  <main id="main"><div class="loading">Loading your tree…</div></main>
</div>
<div id="sheetHost"></div>

<script>
(function(){
  "use strict";
  const KEY='work-tree-v2';
  const PALETTE=['#6E8BEF','#4FBF8B','#E7B84E','#C98BE0','#EF6461','#5BC5D4','#E08A5B'];
  const ICON={
    chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>',
    plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>',
    play:'<svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>',
    pause:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="3" width="5" height="18" rx="1"/><rect x="14" y="3" width="5" height="18" rx="1"/></svg>',
    edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 3a2.8 2.8 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/></svg>',
    check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>',
    cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
    box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>',
    event:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
    flag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"/><line x1="4" y1="22" x2="4" y2="15"/></svg>',
    search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
    dots:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
    back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>',
    target:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="0.5"/></svg>'
  };

  let state={ tree:[], ideas:[] };
  let tab='overview';
  let sheetId=null;
  let ideaId=null;
  let settingsOpen=false;
  let searchOpen=false;
  let searchQuery='';
  let focusId=null;          // tree: focus on one branch
  let mapId=null;            // maps: currently open mind map (null = gallery)
  let mapNodeId=null;        // maps: node being edited in the sheet
  let addingUnder=null;      // id -> show inline add input in projects tab
  let tick=null;

  const uid=()=>'n'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const today=()=>new Date().toISOString().slice(0,10);

  /* ---------- persistence ---------- */
  function seed(){
    const t=today();
    const tm=new Date(Date.now()+864e5).toISOString().slice(0,10);
    const mk=(name,type,extra={})=>Object.assign({id:uid(),name,type,notes:'',status:'active',expanded:true,children:[]},
      type==='task'?{dueDate:null,timeSpent:0,timerRunning:false,timerStartedAt:null,completed:false,repeat:'none'}:{},extra);
    return [
      mk('Dealership — Store 1','workspace',{color:PALETTE[0],children:[
        mk('Spring sales push','project',{children:[ mk('Book radio slots','task',{dueDate:t}) ]})
      ]}),
      mk('Dealership — Store 2','workspace',{color:PALETTE[1],expanded:false}),
      mk('Dealership — Store 3','workspace',{color:PALETTE[2],expanded:false}),
      mk('Client — Marketing retainer','workspace',{color:PALETTE[3],children:[
        mk('August content','project',{children:[
          mk('Draft social calendar','task',{dueDate:t}),
          mk('Design 3 story ads','task',{dueDate:tm})
        ]})
      ]}),
      mk('Personal projects','workspace',{color:PALETTE[4],expanded:false})
    ];
  }
  let sheetUrl='';
  try{ sheetUrl=localStorage.getItem('wt-sheet-url')||''; }catch(e){}
  let calOn=false;
  try{ calOn=localStorage.getItem('wt-cal')==='1'; }catch(e){}
  let calTimer=null;
  function scheduleCalSync(){ if(!calOn||!sheetUrl) return; if(calTimer) clearTimeout(calTimer); calTimer=setTimeout(calSyncNow,4000); }
  function calSyncNow(){
    if(!sheetUrl) return Promise.resolve();
    setSave('calendar…');
    return fetch(sheetUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'calsync'})})
      .then(r=>r.json()).then(j=>{ setSave(j&&j.ok?'calendar synced':'calendar: update script'); setTimeout(()=>setSave(saveLabel()),2500); return j; })
      .catch(()=>{ setSave('calendar sync failed'); setTimeout(()=>setSave(saveLabel()),2500); });
  }

  const store={
    mode:'none',
    useSheet(){ return !!sheetUrl; },
    hasCloud(){ return !!(typeof window!=='undefined' && window.storage && window.storage.get && window.storage.set); },
    async get(k){
      if(this.useSheet()){
        try{
          const r=await fetch(sheetUrl+(sheetUrl.indexOf('?')>-1?'&':'?')+'key='+encodeURIComponent(k));
          if(!r.ok) throw new Error('http '+r.status);
          const j=await r.json();
          this.mode='sheet';
          if(j&&j.value!=null){ try{localStorage.setItem(k,j.value);}catch(e){} return j.value; }
          return null;
        }catch(e){
          this.mode='sheet-offline';
          try{ return localStorage.getItem(k); }catch(e2){ return null; }
        }
      }
      if(this.hasCloud()){
        try{ const r=await window.storage.get(k,false); this.mode='cloud'; return r&&r.value?r.value:null; }catch(e){}
      }
      try{ const v=localStorage.getItem(k); if(this.mode!=='cloud') this.mode='local'; return v; }catch(e){ this.mode='none'; return null; }
    },
    async set(k,v){
      try{ localStorage.setItem(k,v); }catch(e){}
      if(this.useSheet()){
        try{
          const r=await fetch(sheetUrl,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({key:k,value:v})});
          if(!r.ok) throw new Error('http '+r.status);
          this.mode='sheet';
        }catch(e){ this.mode='sheet-offline'; }
        return true;
      }
      if(this.hasCloud()){
        try{ await window.storage.set(k,v,false); this.mode='cloud'; return true; }catch(e){}
      }
      this.mode='local'; return true;
    },
    setSheetUrl(u){
      sheetUrl=(u||'').trim();
      try{ if(sheetUrl) localStorage.setItem('wt-sheet-url',sheetUrl); else localStorage.removeItem('wt-sheet-url'); }catch(e){}
    }
  };
  function serialize(){ return JSON.stringify(state,(k,v)=>k.charAt(0)==='_'?undefined:v); }

  async function load(){
    try{
      const raw=await store.get(KEY);
      if(raw){ state=JSON.parse(raw); }
      else { state={tree:seed(),ideas:[]}; await persist(); }
    }catch(e){ state={tree:seed(),ideas:[]}; try{await persist();}catch(_){} }
    migrate();
    render(); startTick();
  }
  function migrate(){
    if(!state.ideas) state.ideas=[];
    if(!state.maps) state.maps=[];
    // ideas: {text} -> {title, body, color}
    state.ideas=state.ideas.map(it=>{
      if(it.title!==undefined) return Object.assign({body:'',color:PALETTE[3]},it);
      const words=(it.text||'').trim();
      const title=words.length>42?words.slice(0,42):words;
      const body=words.length>42?words:'';
      return {id:it.id||uid(),title:title||'Untitled',body:body,color:it.color||PALETTE[3],ts:it.ts||new Date().toISOString()};
    });
    walk(n=>{
      if(n.type==='task'){
        if(n.repeat===undefined) n.repeat='none';
        if(n.kind===undefined) n.kind='task';      // 'task' | 'event' | 'deadline'
        if(n.flow===undefined) n.flow='active';     // 'active' | 'waiting' | 'blocked'
      } else {
        if(n.status===undefined) n.status='active'; // active|hold|waiting|blocked|done
      }
    });
  }
  function touch(id){ // mark a node (and it's the natural "last updated") 
    const f=id?find(id):null; if(f) f.node.updatedAt=Date.now();
  }
  function persist(){
    setSave('saving…');
    return store.set(KEY,serialize()).then(ok=>{ setSave(saveLabel()); scheduleCalSync(); });
  }
  function saveLabel(){
    return {sheet:'synced via sheet','sheet-offline':'offline · retrying',cloud:'synced',local:'saved on device',none:'not saving'}[store.mode]||'synced';
  }
  function setSave(t){ const el=document.getElementById('saveState'); if(el) el.textContent=t; }

  /* ---------- tree helpers ---------- */
  function find(id,nodes=state.tree,parent=null){
    for(const n of nodes){
      if(n.id===id) return {node:n,parent,siblings:nodes};
      if(n.children){ const f=find(id,n.children,n); if(f) return f; }
    }
    return null;
  }
  function walk(fn,nodes=state.tree){ nodes.forEach(n=>{ fn(n); if(n.children) walk(fn,n.children); }); }
  function stopOthers(except){
    walk(n=>{ if(n.type==='task'&&n.timerRunning&&n.id!==except){ n.timeSpent+=(Date.now()-n.timerStartedAt)/1000; n.timerRunning=false; n.timerStartedAt=null; } });
  }
  function runningTask(){ let r=null; walk(n=>{ if(n.type==='task'&&n.timerRunning) r=n; }); return r; }
  function liveSecs(n){ return (n.timeSpent||0)+(n.timerRunning?(Date.now()-n.timerStartedAt)/1000:0); }
  function subtreeSecs(n){ let s=0; walk(m=>{ if(m.type==='task') s+=liveSecs(m); },[n]); return s; }
  function countOpen(n){ let c=0; walk(m=>{ if(m.type==='task'&&!m.completed) c++; },[n]); return c; }
  function allTasks(){ const out=[]; const path=[]; (function rec(nodes,trail){ nodes.forEach(n=>{ const t=trail.concat(n.name); if(n.type==='task') out.push({task:n,trail:trail}); if(n.children) rec(n.children,t); }); })(state.tree,[]); return out; }

  function fmtDur(s){ s=Math.max(0,Math.round(s)); const h=Math.floor(s/3600),m=Math.floor(s%3600/60); if(h) return h+'h '+String(m).padStart(2,'0')+'m'; if(m) return m+'m'; return s+'s'; }
  function fmtClock(s){ s=Math.max(0,Math.round(s)); const h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60; return (h?h+':':'')+String(m).padStart(h?2:1,'0')+':'+String(ss).padStart(2,'0'); }
  function fmtDate(iso){ return new Date(iso+'T00:00:00').toLocaleDateString(undefined,{month:'short',day:'numeric'}); }
  function dueMeta(d){ if(!d) return null; const t=today(); if(d<t) return {label:'Overdue '+fmtDate(d),cls:'late'}; if(d===t) return {label:'Today',cls:'today'}; return {label:fmtDate(d),cls:''}; }
  function statusColor(n){
    if(isLeaf(n)){
      if(n.completed) return 'var(--ok)';
      if(flowOf(n)==='blocked') return 'var(--late)';
      if(flowOf(n)==='waiting') return 'var(--warn)';
      const d=dueMeta(n.dueDate); if(d&&d.cls==='late') return 'var(--late)'; if(d&&d.cls==='today') return 'var(--warn)'; return 'var(--dim)';
    }
    if(n.status==='done') return 'var(--ok)';
    if(n.status==='hold'||n.status==='waiting') return 'var(--warn)';
    if(n.status==='blocked') return 'var(--late)';
    let late=false; walk(m=>{ if(isLeaf(m)&&!m.completed&&m.dueDate&&m.dueDate<today()) late=true; },[n]);
    return late?'var(--late)':(n.color||'var(--accent)');
  }
  function esc(s){ return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  /* ---------- classification helpers ---------- */
  function kindOf(n){ return n.type==='task' ? (n.kind||'task') : n.type; }
  function isLeaf(n){ return n.type==='task'; }
  function flowOf(n){ return n.flow||'active'; }
  function kindIcon(n){
    const k=kindOf(n);
    if(k==='event') return ICON.event;
    if(k==='deadline') return ICON.flag;
    return '';
  }
  function daysSince(ts){
    if(!ts) return null;
    const d=Math.floor((Date.now()-new Date(ts).getTime())/864e5);
    return d;
  }
  function sinceLabel(ts){ const d=daysSince(ts); if(d==null) return ''; if(d<=0) return 'today'; if(d===1) return '1 day'; return d+' days'; }

  // status badge for a branch (project/workspace) or a task's flow
  function statusInfo(n){
    if(isLeaf(n)){
      if(n.completed) return {key:'done',label:'DONE',cls:'b-done'};
      if(flowOf(n)==='waiting') return {key:'waiting',label:'WAITING',cls:'b-wait'};
      if(flowOf(n)==='blocked') return {key:'blocked',label:'BLOCKED',cls:'b-block'};
      return {key:'active',label:'ACTIVE',cls:'b-active'};
    }
    const s=n.status||'active';
    return {active:{key:'active',label:'ACTIVE',cls:'b-active'},
            hold:{key:'hold',label:'ON HOLD',cls:'b-hold'},
            waiting:{key:'waiting',label:'WAITING',cls:'b-wait'},
            blocked:{key:'blocked',label:'BLOCKED',cls:'b-block'},
            done:{key:'done',label:'DONE',cls:'b-done'}}[s]||{key:'active',label:'ACTIVE',cls:'b-active'};
  }
  function badge(n){ const s=statusInfo(n); return `<span class="badge ${s.cls}">${s.label}</span>`; }

  // one reusable rollup for any branch node
  function summarize(node){
    let open=0,overdue=0,dueToday=0,waiting=0,blocked=0,done=0,total=0,tracked=0,projects=0;
    const t=today();
    const events=[],deadlines=[],openTasks=[];
    walk(m=>{
      if(m===node) return;
      if(m.type==='project') projects++;
      if(!isLeaf(m)) return;
      const k=kindOf(m);
      tracked+=liveSecs(m);
      if(m.completed){ done++; return; }
      total++;
      if(k==='event'){ if(m.dueDate) events.push(m); }
      else if(k==='deadline'){ if(m.dueDate) deadlines.push(m); }
      else {
        open++;
        if(flowOf(m)==='waiting') waiting++;
        else if(flowOf(m)==='blocked') blocked++;
        if(m.dueDate&&m.dueDate<t) overdue++;
        else if(m.dueDate===t) dueToday++;
        openTasks.push(m);
      }
    },[node]);
    events.sort((a,b)=>(a.dueDate||'9999')<(b.dueDate||'9999')?-1:1);
    deadlines.sort((a,b)=>(a.dueDate||'9999')<(b.dueDate||'9999')?-1:1);
    const nextEvent=events.find(e=>e.dueDate>=t)||null;
    const nextDeadline=deadlines.find(d=>d.dueDate>=t)||null;
    // next action: designated one if valid, else earliest-due open active task
    let nextAction=null;
    if(node.nextActionId){ const f=find(node.nextActionId); if(f&&isLeaf(f.node)&&!f.node.completed&&kindOf(f.node)==='task') nextAction=f.node; }
    if(!nextAction){
      const cand=openTasks.filter(x=>flowOf(x)==='active').sort((a,b)=>(a.dueDate||'9999')<(b.dueDate||'9999')?-1:1);
      nextAction=cand[0]||null;
    }
    let updatedAt=node.updatedAt||0; walk(m=>{ if(m.updatedAt&&m.updatedAt>updatedAt) updatedAt=m.updatedAt; },[node]);
    return {open,overdue,dueToday,waiting,blocked,done,total,tracked,projects,events,deadlines,nextEvent,nextDeadline,nextAction,updatedAt};
  }

  // breadcrumb path (array of {id,name}) from root to node's parent chain
  function crumbs(id){
    const path=[];
    (function rec(nodes,trail){
      for(const n of nodes){
        const t=trail.concat([{id:n.id,name:n.name}]);
        if(n.id===id){ path.push(...trail); return true; }
        if(n.children&&rec(n.children,t)) return true;
      }
      return false;
    })(state.tree,[]);
    return path;
  }
  function crumbHTML(id){
    const c=crumbs(id); if(!c.length) return '';
    return `<div class="crumbs">Work ${c.map(x=>`<span class="crumb-sep">›</span> <span class="crumb" data-open="${x.id}">${esc(clip(x.name,18))}</span>`).join(' ')}</div>`;
  }
  function eventDateLabel(n){
    if(!n.dueDate) return '';
    const d=fmtDate(n.dueDate); const wd=new Date(n.dueDate+'T00:00:00').toLocaleDateString(undefined,{weekday:'short'});
    return wd+' '+d+(n.eventTime?' · '+n.eventTime:'');
  }

  /* ---------- mutations ---------- */
  function addChild(parentId,name,type,kind){
    name=(name||'').trim(); if(!name) return null;
    const base={id:uid(),name,type,notes:'',status:'active',expanded:true,children:[],updatedAt:Date.now()};
    if(type==='task') Object.assign(base,{dueDate:null,timeSpent:0,timerRunning:false,timerStartedAt:null,completed:false,repeat:'none',kind:kind||'task',flow:'active'});
    if(parentId===null){ base.color=PALETTE[state.tree.length%PALETTE.length]; state.tree.push(base); }
    else { const p=find(parentId).node; p.expanded=true; p.children.push(base); }
    persist(); render(); return base;
  }
  function toggleExpand(id){ const n=find(id).node; n.expanded=!n.expanded; persist(); render(); }
  function advanceDate(iso,repeat){
    const base=iso?new Date(iso+'T00:00:00'):new Date();
    if(repeat==='daily') base.setDate(base.getDate()+1);
    else if(repeat==='weekly') base.setDate(base.getDate()+7);
    else if(repeat==='monthly') base.setMonth(base.getMonth()+1);
    return base.toISOString().slice(0,10);
  }
  function toggleDone(id){
    const n=find(id).node;
    if(!n.completed && n.repeat && n.repeat!=='none'){
      // recurring: log the session, roll forward, stay open
      if(n.timerRunning){ n.timeSpent+=(Date.now()-n.timerStartedAt)/1000; n.timerRunning=false; n.timerStartedAt=null; }
      n.dueDate=advanceDate(n.dueDate,n.repeat);
      n.lastDone=today();
      persist(); render(); return;
    }
    n.completed=!n.completed;
    if(n.completed&&n.timerRunning){ n.timeSpent+=(Date.now()-n.timerStartedAt)/1000; n.timerRunning=false; n.timerStartedAt=null; }
    persist(); render();
  }
  function toggleTimer(id){ const n=find(id).node; if(n.timerRunning){ n.timeSpent+=(Date.now()-n.timerStartedAt)/1000; n.timerRunning=false; n.timerStartedAt=null; } else { stopOthers(id); n.timerRunning=true; n.timerStartedAt=Date.now(); } persist(); render(); }
  function remove(id){ const f=find(id); if(f.parent) f.parent.children=f.parent.children.filter(c=>c.id!==id); else state.tree=state.tree.filter(c=>c.id!==id); sheetId=null; persist(); render(); }

  /* ---------- calendar (.ics download) ---------- */
  function addToCalendar(n){
    if(!n.dueDate){ alert('Set a due date first, then add to calendar.'); return; }
    const d=n.dueDate.replace(/-/g,'');
    const dtEnd=new Date(n.dueDate+'T00:00:00'); dtEnd.setDate(dtEnd.getDate()+1);
    const de=dtEnd.toISOString().slice(0,10).replace(/-/g,'');
    const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Work Tree//EN','BEGIN:VEVENT',
      'UID:'+n.id+'@worktree','DTSTART;VALUE=DATE:'+d,'DTEND;VALUE=DATE:'+de,
      'SUMMARY:'+(n.name||'Task').replace(/\n/g,' '),
      'DESCRIPTION:'+(n.notes||'').replace(/\n/g,'\\n'),'END:VEVENT','END:VCALENDAR'].join('\r\n');
    const blob=new Blob([ics],{type:'text/calendar'});
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download=(n.name||'task').replace(/[^a-z0-9]+/gi,'-').toLowerCase()+'.ics';
    document.body.appendChild(a); a.click(); a.remove();
  }

  /* ============ RENDER ============ */
  function render(){
    document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===tab));
    let due=0; const t=today(); walk(n=>{ if(isLeaf(n)&&!n.completed&&n.dueDate&&n.dueDate<=t) due++; });
    const tc=document.getElementById('todoCount'); if(tc) tc.textContent=due?due:'';
    const main=document.getElementById('main');
    if(tab==='overview') main.innerHTML=viewOverview();
    else if(tab==='projects') main.innerHTML=viewProjects();
    else if(tab==='today') main.innerHTML=viewToday();
    else if(tab==='maps') main.innerHTML=viewMaps();
    else main.innerHTML=viewIdeas();
    wire();
    renderSheet();
  }

  /* ---- Overview: node CANVAS (pan / zoom / drag-to-reparent) ---- */
  const NODE_W=176, BOX_H=50, H_GAP=30, V_GAP=74, PAD=60;
  const MIN_W=120, MIN_H=44;
  let cam=null;              // {x,y,scale}
  let pinching=false;        // true while a 2-finger gesture is active
  let layout=[];             // [{node, x, y, depth}]
  let addMenuFor=null;
  let selected=new Set();    // multi-selected node ids (ephemeral)
  let selectMode=false;      // marquee vs pan
  function getW(n){ return (typeof n.w==='number')?n.w:NODE_W; }
  function getH(n){ return (typeof n.h==='number')?n.h:BOX_H; }

  function treeRoots(){ if(focusId){ const f=find(focusId); if(f) return [f.node]; focusId=null; } return state.tree; }

  function viewOverview(){
    const t=today();
    let overdue=0,todayN=0,waitBlock=0,running=runningTask();
    walk(n=>{ if(isLeaf(n)&&!n.completed){ if(kindOf(n)==='task'){ if(n.dueDate&&n.dueDate<t) overdue++; else if(n.dueDate===t) todayN++; if(flowOf(n)==='waiting'||flowOf(n)==='blocked') waitBlock++; } } });
    let totalSecs=0; walk(n=>{ if(isLeaf(n)) totalSecs+=liveSecs(n); });
    const strip=`<div class="cc-strip">
      <div class="cc-stat ${overdue?'alert':''}"><span class="cc-num">${overdue}</span><span class="cc-lab">Overdue</span></div>
      <div class="cc-stat ${todayN?'warnc':''}"><span class="cc-num">${todayN}</span><span class="cc-lab">Due today</span></div>
      <div class="cc-stat"><span class="cc-num">${waitBlock}</span><span class="cc-lab">Wait/Block</span></div>
      <div class="cc-stat"><span class="cc-num">${fmtDur(totalSecs).replace(' ','')}</span><span class="cc-lab">Tracked</span></div>
    </div>`;

    const focusBar = focusId
      ? `<div class="focus-bar"><button id="cvBack" class="focus-back">${ICON.back} Full tree</button><span class="focus-name">Focused: ${esc(clip(find(focusId).node.name,26))}</span></div>`
      : '';
    const treeBar = `<div class="tree-bar">
      <button class="tbtn" id="cvCollapse">Collapse all</button>
      <button class="tbtn" id="cvProjects">Projects level</button>
      <button class="tbtn" id="cvExpandAll">Expand all</button>
    </div>`;

    const {worldW,worldH}=computeLayout();
    let svg=`<svg class="cv-links" width="${worldW}" height="${worldH}">`;
    layout.forEach(L=>{
      const kids=(!isLeaf(L.node)&&L.node.expanded&&L.node.children)?L.node.children:[];
      kids.forEach(c=>{
        const cl=layout.find(x=>x.node===c); if(!cl) return;
        const x1=L.x+getW(L.node)/2, y1=L.y+getH(L.node), x2=cl.x+getW(c)/2, y2=cl.y, my=(y1+y2)/2;
        svg+=`<path d="M${x1} ${y1} C ${x1} ${my}, ${x2} ${my}, ${x2} ${y2}" fill="none" stroke="${statusColor(L.node)}" stroke-opacity=".4" stroke-width="1.6"/>`;
        svg+=`<circle cx="${x1}" cy="${y1}" r="3" fill="${statusColor(L.node)}"/><circle cx="${x2}" cy="${y2}" r="3" fill="${statusColor(L.node)}"/>`;
      });
    });
    svg+=`</svg>`;
    let nodes=''; layout.forEach(L=>{ nodes+=canvasNode(L); });
    if(!layout.length) nodes=`<div style="position:absolute;left:40px;top:40px;color:var(--faint);font-size:13px">Nothing here. Add a workspace below.</div>`;

    const selCount=selected.size;
    const hint = selCount ? `${selCount} selected · drag to move together`
      : (selectMode ? 'Select mode: drag a box · tap ▣ to exit' : 'Tap a node to open · drag to move · pinch/scroll to zoom');

    return `${strip}${focusBar}${treeBar}
      <div class="cv-viewport" id="cvViewport">
        <div class="cv-world" id="cvWorld">${svg}${nodes}</div>
        <div class="cv-controls">
          <button id="cvSelect" class="${selectMode?'active':''}" title="Multi-select">▣</button>
          <button id="cvZoomIn" title="Zoom in">+</button>
          <button id="cvZoomOut" title="Zoom out">−</button>
          <button id="cvFit" title="Fit to view">⤢</button>
          <button id="cvArrange" title="Auto-arrange">⟲</button>
        </div>
        <div class="cv-hint">${hint}</div>
      </div>
      <button class="add-inline block" id="addWs">${ICON.plus} New workspace</button>`;
  }

  function collapseAllTree(){ walk(n=>{ if(!isLeaf(n)) n.expanded=false; }); persist(); render(); }
  function expandAllTree(){ walk(n=>{ if(!isLeaf(n)) n.expanded=true; }); persist(); render(); }
  function expandToProjects(){
    (function rec(nodes,depth){ nodes.forEach(n=>{ if(!isLeaf(n)){ n.expanded=depth<1; if(n.children) rec(n.children,depth+1); } }); })(treeRoots(),0);
    persist(); render();
  }

  function computeLayout(){
    markVisible();
    let leaf=0;
    function measure(n,depth){
      n._d=depth;
      const kids=(!isLeaf(n)&&n.expanded&&n.children&&n.children.length)?n.children:null;
      if(!kids){ n._row=leaf; leaf++; return {t:n._row,b:n._row}; }
      let t=Infinity,b=-Infinity;
      kids.forEach(c=>{ const r=measure(c,depth+1); t=Math.min(t,r.t); b=Math.max(b,r.b); });
      n._row=(t+b)/2; return {t,b};
    }
    treeRoots().forEach(n=>measure(n,0));
    layout=[];
    let maxDepth=0, maxX=0, maxY=0;
    walk(n=>{ if(n._vis){
      const ax=PAD+n._row*(NODE_W+H_GAP), ay=PAD+n._d*(BOX_H+V_GAP);
      const x=(typeof n.x==='number')?n.x:ax;
      const y=(typeof n.y==='number')?n.y:ay;
      layout.push({node:n,x,y,depth:n._d});
      if(n._d>maxDepth) maxDepth=n._d; if(x+getW(n)>maxX) maxX=x+getW(n); if(y+getH(n)>maxY) maxY=y+getH(n);
    } });
    const worldW=Math.max(PAD*2+Math.max(1,leaf)*(NODE_W+H_GAP), maxX+PAD);
    const worldH=Math.max(PAD*2+(maxDepth+1)*(BOX_H+V_GAP), maxY+PAD+24);
    return {worldW,worldH};
  }

  function canvasNode(L){
    const n=L.node, leaf=isLeaf(n), k=kindOf(n);
    const hasKids=!leaf&&n.children&&n.children.length;
    const col=statusColor(n);
    let icon;
    if(leaf){
      if(k==='task') icon=`<span class="cv-ic task ${n.completed?'done':''}" data-done="${n.id}" style="--c:${col}">${n.completed?ICON.check:''}</span>`;
      else icon=`<span class="cv-ic kind" style="--c:${col}">${kindIcon(n)}</span>`;
    } else icon=`<span class="cv-ic branch" style="--c:${col}">${ICON.box}</span>`;

    const si=statusInfo(n);
    const badgeHtml = (si.key!=='active') ? `<span class="cv-badge ${si.cls}">${si.label}</span>` : '';

    let cap='';
    if(leaf){
      if(k==='event') cap=eventDateLabel(n);
      else if(k==='deadline'){ const d=dueMeta(n.dueDate); cap=(d?d.label:'no date'); }
      else { const d=dueMeta(n.dueDate); const b=[]; if(n.completed)b.push('done'); else if(d)b.push(d.label); if(flowOf(n)==='waiting'&&n.waitingFor)b.push('for '+clip(n.waitingFor,12)); if(n.repeat&&n.repeat!=='none')b.push('↻'); const ls=liveSecs(n); if(ls>0||n.timerRunning)b.push(n.timerRunning?fmtClock(ls):fmtDur(ls)); cap=b.join(' · '); }
    } else {
      const s=summarize(n);
      if(n.type==='workspace'){ const b=[]; if(s.projects)b.push(s.projects+' proj'); b.push(s.open+' open'); if(s.overdue)b.push(s.overdue+' od'); cap=b.join(' · '); }
      else { if(s.nextAction) cap='→ '+clip(s.nextAction.name,15)+' · '+s.open+' open'+(s.overdue?' · '+s.overdue+' od':''); else cap=(s.total? s.open+' open'+(s.overdue?' · '+s.overdue+' od':'') : 'empty'); }
    }
    const capId=leaf&&k==='task'?`data-live-cap="${n.id}"`:'';

    const editBtn=`<button class="cv-mini" data-open="${n.id}" title="Open">${ICON.edit}</button>`;
    const acts = leaf
      ? (k==='task'?`${editBtn}<button class="cv-mini play ${n.timerRunning?'on':''}" data-timer="${n.id}" title="Timer">${n.timerRunning?ICON.pause:ICON.play}</button>`:editBtn)
      : `${editBtn}<button class="cv-mini" data-cvadd="${n.id}" title="Add inside">${ICON.plus}</button>${hasKids?`<button class="cv-mini" data-exp="${n.id}" title="Collapse/expand">${n.expanded?'−':'+'}</button>`:''}`;
    const w=getW(n), h=getH(n), isSel=selected.has(n.id);
    return `<div class="cv-node ${leaf?'task':'branch'} ${isSel?'sel':''}" data-node="${n.id}" style="left:${L.x}px;top:${L.y}px;width:${w}px">
      <div class="cv-box" data-cvopen="${n.id}" title="${esc(n.name)}" style="--c:${col};height:${h}px">
        ${icon}
        <span class="cv-title">${esc(clip(n.name,badgeHtml?15:20))}</span>
        ${badgeHtml}
        <span class="cv-acts">${acts}</span>
        <span class="cv-resize" data-resize="${n.id}" title="Resize"></span>
      </div>
      <div class="cv-cap" ${capId} title="${esc(cap)}">${esc(cap)}</div>
    </div>`;
  }

  function markVisible(){
    walk(n=>{ n._vis=false; });
    (function rec(nodes,vis){ nodes.forEach(n=>{ n._vis=vis; const cv=vis&&!isLeaf(n)&&n.expanded; if(n.children) rec(n.children,cv); }); })(treeRoots(),true);
  }
  function clip(s,n){ s=String(s); return s.length>n?s.slice(0,n-1)+'…':s; }

  /* ---- reparent helpers ---- */
  function isDescendant(node,maybeAncestorId){
    let hit=false; walk(m=>{ if(m.id===maybeAncestorId) hit=true; },[node]); return hit;
  }
  function reparent(id,newParentId){
    if(id===newParentId) return false;
    const f=find(id); if(!f) return false;
    if(newParentId){
      const np=find(newParentId); if(!np||np.node.type==='task') return false;
      if(isDescendant(f.node,newParentId)) return false; // can't move into own subtree
    }
    // detach
    if(f.parent) f.parent.children=f.parent.children.filter(c=>c.id!==id);
    else state.tree=state.tree.filter(c=>c.id!==id);
    // attach
    if(newParentId){ const np=find(newParentId).node; np.expanded=true; np.children=np.children||[]; np.children.push(f.node); }
    else state.tree.push(f.node);
    persist(); render(); return true;
  }
  function branchTargets(excludeId){
    const out=[]; 
    (function rec(nodes,depth){ nodes.forEach(n=>{ if(n.type!=='task' && n.id!==excludeId && !(excludeId&&isDescendant(find(excludeId).node,n.id))){ out.push({id:n.id,name:n.name,depth:depth}); } if(n.children) rec(n.children,depth+1); }); })(state.tree,0);
    return out;
  }

  /* ---- Projects: nested editable list ---- */
  function viewProjects(){
    if(!state.tree.length) return emptyProjects();
    let html='<div class="plist">';
    (function rec(nodes,lvl){
      nodes.forEach(n=>{
        html+=projectRow(n,lvl);
        if(!isLeaf(n)&&n.expanded&&n.children&&n.children.length) rec(n.children,lvl+1);
      });
    })(state.tree,0);
    html+='</div>';
    html+=`<button class="add-inline block" id="addWs">${ICON.plus} New workspace</button>`;
    return html;
  }
  function projectRow(n,lvl){
    const leaf=isLeaf(n), k=kindOf(n);
    const hasKids=!leaf&&n.children&&n.children.length;
    const indent=Math.min(lvl,3)*13;
    const col=statusColor(n);
    const si=statusInfo(n);
    const badgeHtml=(si.key!=='active'||!leaf)?`<span class="badge ${si.cls}">${si.label}</span>`:'';
    const lead = leaf
      ? (k==='task'?`<button class="check ${n.completed?'on':''}" data-done="${n.id}">${n.completed?ICON.check:''}</button>`:`<span class="pkind" style="color:${col}">${kindIcon(n)}</span>`)
      : `<button class="caret ${n.expanded?'open':''} ${hasKids?'':'hidden'}" data-exp="${n.id}">${ICON.chev}</button>`;
    let sub='';
    if(leaf){
      const d=dueMeta(n.dueDate); const parts=[];
      if(k==='event') parts.push(eventDateLabel(n)); else if(d) parts.push(d.label);
      if(flowOf(n)==='waiting'&&n.waitingFor) parts.push('waiting: '+clip(n.waitingFor,16));
      if(flowOf(n)==='blocked'&&n.blockedBy) parts.push('blocked: '+clip(n.blockedBy,16));
      if(n.repeat&&n.repeat!=='none') parts.push('↻ '+n.repeat);
      const ls=liveSecs(n); if(ls>0||n.timerRunning) parts.push(n.timerRunning?fmtClock(ls):fmtDur(ls));
      sub=parts.join(' · ');
    } else {
      const s=summarize(n); const parts=[];
      if(s.nextAction) parts.push('→ '+clip(s.nextAction.name,20));
      parts.push(s.open+' open'); if(s.overdue) parts.push(s.overdue+' overdue');
      if(s.waiting) parts.push(s.waiting+' waiting'); if(s.blocked) parts.push(s.blocked+' blocked');
      sub=parts.join(' · ');
    }
    const running = leaf&&n.timerRunning?`<span class="prun" data-live="${n.id}">${fmtClock(liveSecs(n))}</span>`:'';
    return `<div class="prow ${leaf?'leaf':'branch'} dl${Math.min(lvl,3)}" style="padding-left:${8+indent}px">
      ${lead}
      <button class="pmain" data-open="${n.id}">
        <span class="ptitle-row"><span class="ptitle ${n.completed?'done':''}">${esc(n.name)}</span>${badgeHtml}</span>
        ${sub?`<span class="psub">${esc(sub)}</span>`:''}
      </button>
      ${running}
      <button class="pmenu" data-rowmenu="${n.id}" title="More">${ICON.dots}</button>
    </div>`;
  }
  function emptyProjects(){ return `<div class="empty">No workspaces yet.<br>Add one for each dealership, client, or personal track.</div><button class="add-inline block" id="addWs">${ICON.plus} New workspace</button>`; }

  /* ---- shared compact item row (Today / Search) ---- */
  function itemRow(n){
    const k=kindOf(n), col=statusColor(n);
    const c=crumbs(n.id); const parent=c.length?c.map(x=>x.name).slice(-2).join(' › '):'';
    const lead = (k==='task')?`<button class="check ${n.completed?'on':''}" data-done="${n.id}">${n.completed?ICON.check:''}</button>`
      : `<span class="pkind" style="color:${col}">${kindIcon(n)}</span>`;
    const d=dueMeta(n.dueDate); const meta=[];
    if(k==='event') meta.push(eventDateLabel(n)); else if(k==='deadline') meta.push(d?d.label:'no date'); else if(d) meta.push(d.label);
    if(flowOf(n)==='waiting'&&n.waitingFor) meta.push('for '+n.waitingFor+(n.flowSince?' · '+sinceLabel(n.flowSince):''));
    if(flowOf(n)==='blocked'&&n.blockedBy) meta.push('by '+n.blockedBy+(n.flowSince?' · '+sinceLabel(n.flowSince):''));
    const running=n.timerRunning?`<span class="prun" data-live="${n.id}">${fmtClock(liveSecs(n))}</span>`:'';
    return `<div class="prow leaf">
      ${lead}
      <button class="pmain" data-open="${n.id}">
        <span class="ptitle-row"><span class="ptitle ${n.completed?'done':''}">${esc(n.name)}</span></span>
        <span class="psub"><span style="color:var(--faint)">${esc(parent)}</span>${meta.length?' · '+esc(meta.join(' · ')):''}</span>
      </button>
      ${running}
      <button class="pmenu" data-rowmenu="${n.id}">${ICON.dots}</button>
    </div>`;
  }
  function sectionBlock(title,rows,cap){
    if(!rows.length) return '';
    let shown=rows, extra='';
    if(cap&&rows.length>cap){ shown=rows.slice(0,cap); extra=`<div class="more-note">+${rows.length-cap} more</div>`; }
    return `<div class="section-label">${title} · ${rows.length}</div>`+shown.map(itemRow).join('')+extra;
  }

  /* ---- Today dashboard ---- */
  function viewToday(){
    const t=today();
    const overdue=[],dueTodayArr=[],eventsToday=[],deadlines=[],waiting=[],blocked=[],nextActions=[];
    walk(n=>{ if(n.type==='project'){ const st=n.status||'active'; if(st!=='done'&&st!=='hold'){ const s=summarize(n); if(s.nextAction) nextActions.push(s.nextAction); } } });
    walk(n=>{
      if(!isLeaf(n)) return; const k=kindOf(n);
      if(k==='event'){ if(!n.completed&&n.dueDate===t) eventsToday.push(n); return; }
      if(k==='deadline'){ if(!n.completed&&n.dueDate&&n.dueDate>=t) deadlines.push(n); return; }
      if(n.completed) return;
      if(flowOf(n)==='waiting'){ waiting.push(n); return; }
      if(flowOf(n)==='blocked'){ blocked.push(n); return; }
      if(n.dueDate&&n.dueDate<t) overdue.push(n); else if(n.dueDate===t) dueTodayArr.push(n);
    });
    deadlines.sort((a,b)=>(a.dueDate<b.dueDate?-1:1));
    const dedupeNext=[]; const seen={}; nextActions.forEach(x=>{ if(!seen[x.id]){ seen[x.id]=1; dedupeNext.push(x); } });

    const hdr=`<div class="cc-strip">
      <div class="cc-stat ${overdue.length?'alert':''}"><span class="cc-num">${overdue.length}</span><span class="cc-lab">Overdue</span></div>
      <div class="cc-stat ${dueTodayArr.length?'warnc':''}"><span class="cc-num">${dueTodayArr.length}</span><span class="cc-lab">Due today</span></div>
      <div class="cc-stat"><span class="cc-num">${eventsToday.length}</span><span class="cc-lab">Events</span></div>
      <div class="cc-stat ${blocked.length?'alert':''}"><span class="cc-num">${waiting.length+blocked.length}</span><span class="cc-lab">Wait/Block</span></div>
    </div>`;

    let body='';
    body+=sectionBlock('Next actions',dedupeNext,8);
    body+=sectionBlock('Overdue',overdue,10);
    body+=sectionBlock('Due today',dueTodayArr,10);
    body+=sectionBlock('Events today',eventsToday,10);
    body+=sectionBlock('Upcoming deadlines',deadlines,8);
    body+=sectionBlock('Waiting',waiting,10);
    body+=sectionBlock('Blocked',blocked,10);
    if(!body) body=`<div class="empty">Nothing needs attention right now.<br>Add due dates or events and they'll show up here.</div>`;
    return hdr+body;
  }

  /* ---- row ••• menu + quick actions ---- */
  function ancestorProject(id){
    const c=crumbs(id);
    for(let i=c.length-1;i>=0;i--){ const f=find(c[i].id); if(f&&f.node.type==='project') return f.node; }
    for(let i=c.length-1;i>=0;i--){ const f=find(c[i].id); if(f) return f.node; }
    return null;
  }
  function setNextAction(taskId){ const p=ancestorProject(taskId); if(p){ p.nextActionId=taskId; p.updatedAt=Date.now(); persist(); render(); } }
  function quickAdd(parentId,kind){
    let node;
    if(kind==='project') node=addChild(parentId,'New sub-project','project');
    else node=addChild(parentId,'New '+kind,'task',kind);
    if(node) openSheet(node.id);
  }
  function openRowMenu(id,e){
    closeRowMenu();
    const n=find(id).node, leaf=isLeaf(n), k=kindOf(n);
    const items=[['open','Open']];
    if(!leaf){ items.push(['add-task','+ Task'],['add-event','+ Event'],['add-deadline','+ Deadline'],['add-project','+ Sub-project']); }
    if(leaf&&k==='task'){ items.push([n.timerRunning?'stop':'start',n.timerRunning?'Stop timer':'Start timer'],['next','Set as Next Action'],[n.completed?'undone':'done',n.completed?'Mark not done':'Mark done']); }
    items.push(['move','Move…'],['delete','Delete']);
    const m=document.createElement('div'); m.className='cv-addmenu'; m.id='rowMenu';
    m.innerHTML=items.map(([a,l])=>`<button data-act="${a}" class="${a==='delete'?'danger':''}">${l}</button>`).join('');
    document.body.appendChild(m);
    const x=Math.min(e.clientX,window.innerWidth-186), y=Math.min(e.clientY,window.innerHeight-280);
    m.style.left=Math.max(8,x)+'px'; m.style.top=Math.max(8,y)+'px';
    m.querySelectorAll('button').forEach(b=>b.onclick=()=>{ const a=b.dataset.act; closeRowMenu(); rowMenuAct(id,a); });
    setTimeout(()=>document.addEventListener('pointerdown',closeRowMenuOnce,{once:true}),0);
  }
  function rowMenuAct(id,act){
    const n=find(id).node;
    if(act==='open') openSheet(id);
    else if(act==='add-task') quickAdd(id,'task');
    else if(act==='add-event') quickAdd(id,'event');
    else if(act==='add-deadline') quickAdd(id,'deadline');
    else if(act==='add-project') quickAdd(id,'project');
    else if(act==='start'||act==='stop') toggleTimer(id);
    else if(act==='next') setNextAction(id);
    else if(act==='done'||act==='undone') toggleDone(id);
    else if(act==='move') openSheet(id);
    else if(act==='delete'){ if(confirm('Delete "'+n.name+'"'+(n.children&&n.children.length?' and everything inside it':'')+'?')) remove(id); }
  }
  function closeRowMenuOnce(e){ if(e.target.closest&&e.target.closest('#rowMenu')) return; closeRowMenu(); }
  function closeRowMenu(){ const m=document.getElementById('rowMenu'); if(m) m.remove(); }

  /* ---- Ideas: sticky-note wall ---- */
  const NOTE_COLORS=['#E7B84E','#6E8BEF','#4FBF8B','#C98BE0','#EF6461','#5BC5D4'];
  function viewIdeas(){
    let html=`<div class="addbar"><input id="ideaInput" placeholder="New note title…"/><button id="ideaAdd">${ICON.plus}</button></div>`;
    if(!state.ideas.length){ html+=`<div class="empty">No notes yet.<br>Jot a quick idea — it'll pin here as a sticky note.</div>`; return html; }
    html+=`<div class="notes-wall">`;
    state.ideas.forEach(it=>{
      const preview=it.body?esc(clip(it.body,90)):'<span class="note-empty">No details yet — tap to add</span>';
      html+=`<div class="note" style="--nc:${it.color||NOTE_COLORS[0]}" data-ideaopen="${it.id}">
        <div class="note-title">${esc(it.title||'Untitled')}</div>
        <div class="note-preview">${preview}</div>
        <div class="note-foot">${it.ts?fmtDate(it.ts.slice(0,10)):''}</div>
      </div>`;
    });
    html+=`</div>`;
    return html;
  }

  function renderIdeaSheet(){
    const host=document.getElementById('sheetHost');
    const it=state.ideas.find(i=>i.id===ideaId);
    if(!it){ ideaId=null; host.innerHTML=''; return; }
    host.innerHTML=`<div class="scrim" id="scrim"><div class="sheet" id="sheet" style="border-top:3px solid ${it.color||NOTE_COLORS[0]}">
      <div class="grabber"></div>
      <div class="kind-tag" style="margin:0 0 10px">STICKY NOTE</div>
      <div class="field"><input class="sheet-title" id="ideaTitle" value="${esc(it.title||'')}" placeholder="Title"/></div>
      <div class="field"><label>Details</label><textarea id="ideaBody" placeholder="Flesh it out…" style="min-height:140px">${esc(it.body||'')}</textarea></div>
      <div class="field"><label>Colour</label><div class="swatches">${NOTE_COLORS.map(c=>`<span class="sw ${it.color===c?'sel':''}" style="background:${c}" data-ideacolor="${c}"></span>`).join('')}</div></div>
      <div class="sheet-foot">
        <button class="btn cal" id="ideaPromote">${ICON.plus} Make workspace</button>
        <button class="btn del" id="ideaDelete">Delete</button>
      </div>
    </div></div>`;
    document.getElementById('scrim').onclick=e=>{ if(e.target.id==='scrim'){ ideaId=null; renderSheet(); render(); } };
    const t=document.getElementById('ideaTitle'); t.onchange=()=>{ it.title=t.value.trim()||'Untitled'; persist(); };
    const b=document.getElementById('ideaBody'); b.onchange=()=>{ it.body=b.value; persist(); };
    document.querySelectorAll('[data-ideacolor]').forEach(el=>el.onclick=()=>{ it.color=el.dataset.ideacolor; persist(); renderIdeaSheet(); render(); });
    document.getElementById('ideaPromote').onclick=()=>{ addChild(null,it.title,'workspace'); state.ideas=state.ideas.filter(i=>i.id!==it.id); ideaId=null; tab='overview'; persist(); render(); };
    document.getElementById('ideaDelete').onclick=()=>{ if(confirm('Delete this note?')){ state.ideas=state.ideas.filter(i=>i.id!==it.id); ideaId=null; persist(); render(); } };
  }

  /* ============ MIND MAPS ============ */
  const MAP_ORIGIN=2600, MAP_WORLD=5200;
  let mcam=null;
  let mapSel=new Set();
  let mapSelectMode=false;
  const MAP_COLORS=['#6E8BEF','#4FBF8B','#E7B84E','#C98BE0','#EF6461','#5BC5D4','#E08A5B'];
  function mapById(id){ return (state.maps||[]).find(m=>m.id===id); }
  function currentMap(){ return mapId?mapById(mapId):null; }
  function mapNode(map,id){ return map.nodes.find(n=>n.id===id); }
  function newMap(name){
    const c=MAP_COLORS[(state.maps.length)%MAP_COLORS.length];
    const root={id:uid(),text:name||'Central idea',x:0,y:0,parent:null,color:c};
    const m={id:uid(),name:name||'Untitled map',color:c,ts:new Date().toISOString(),nodes:[root]};
    state.maps.unshift(m); persist(); mapId=m.id; mcam=null; render();
  }
  function deleteMap(id){ state.maps=state.maps.filter(m=>m.id!==id); if(mapId===id) mapId=null; persist(); render(); }
  function addMapNode(parentId){
    const map=currentMap(); if(!map) return null;
    let nx,ny,parent;
    if(parentId){ const p=mapNode(map,parentId); parent=parentId; const sibs=map.nodes.filter(x=>x.parent===parentId).length;
      nx=p.x+(p.parent?150:180); ny=p.y+(sibs*82)-((p.parent?0:0)); }
    else { const roots=map.nodes.filter(x=>!x.parent).length; nx=roots*60; ny=roots*60; parent=null; }
    const node={id:uid(),text:'New idea',x:nx,y:ny,parent:parent,color:null};
    map.nodes.push(node); map.ts=new Date().toISOString(); persist(); render(); return node;
  }
  function removeMapNode(id){
    const map=currentMap(); if(!map) return;
    const kill=new Set([id]); let grew=true;
    while(grew){ grew=false; map.nodes.forEach(n=>{ if(n.parent&&kill.has(n.parent)&&!kill.has(n.id)){ kill.add(n.id); grew=true; } }); }
    map.nodes=map.nodes.filter(n=>!kill.has(n.id));
    mapNodeId=null; persist(); render();
  }
  function insertParentOf(id){
    const map=currentMap(); if(!map) return null;
    const n=mapNode(map,id); if(!n) return null;
    const node={id:uid(),text:'New idea',x:n.x-40,y:n.y-70,parent:n.parent,color:n.color||null};
    n.parent=node.id;
    map.nodes.push(node); map.ts=new Date().toISOString(); persist(); render(); return node;
  }
  function makeParentOfSelected(){
    const map=currentMap(); if(!map||mapSel.size<1) return;
    const ids=[...mapSel].filter(id=>mapNode(map,id));
    if(!ids.length) return;
    // centroid for placement, just above the group
    let sx=0,sy=0; ids.forEach(id=>{ const n=mapNode(map,id); sx+=n.x; sy+=n.y; });
    const cx=sx/ids.length, cy=sy/ids.length;
    // common parent if they all share one, else new node becomes a root
    const parents=new Set(ids.map(id=>mapNode(map,id).parent));
    const commonParent = parents.size===1 ? [...parents][0] : null;
    // don't let the new node's parent be one of the selected (would orphan); if so, root it
    const parent = (commonParent && !ids.includes(commonParent)) ? commonParent : null;
    const node={id:uid(),text:'New idea',x:cx,y:cy-110,parent:parent,color:map.color||null};
    map.nodes.push(node);
    ids.forEach(id=>{ mapNode(map,id).parent=node.id; });
    map.ts=new Date().toISOString(); mapSel.clear(); persist(); render();
    openMapNode(node.id);
  }
  function openMap(id){ mapId=id; mcam=null; sheetId=null; searchOpen=false; settingsOpen=false; render(); }
  function openMapNode(id){ mapNodeId=id; renderSheet(); }

  function viewMaps(){ return mapId?viewMapEditor():viewMapGallery(); }
  function viewMapGallery(){
    if(!state.maps||!state.maps.length){
      return `<div class="empty">No mind maps yet.<br>Make one for a campaign, a brainstorm, a plan — each gets its own canvas.</div>
        <button class="add-inline block" id="newMapBtn">${ICON.plus} New mind map</button>`;
    }
    let cards=state.maps.map(m=>{
      const count=m.nodes.length;
      return `<button class="map-card" data-mapopen="${m.id}" style="--mc:${m.color||'#6E8BEF'}">
        <span class="map-card-title">${esc(m.name)}</span>
        <span class="map-card-meta">${count} node${count===1?'':'s'}</span>
        <span class="map-card-menu" data-mapmenu="${m.id}">${ICON.dots}</span>
      </button>`;
    }).join('');
    return `<div class="map-gallery">${cards}</div>
      <button class="add-inline block" id="newMapBtn">${ICON.plus} New mind map</button>`;
  }
  function mapCurve(p,c){
    const x1=p.x+MAP_ORIGIN,y1=p.y+MAP_ORIGIN,x2=c.x+MAP_ORIGIN,y2=c.y+MAP_ORIGIN,mx=(x1+x2)/2;
    const col=c.color||p.color||'#6E8BEF';
    return `<path d="M${x1} ${y1} C ${mx} ${y1}, ${mx} ${y2}, ${x2} ${y2}" fill="none" stroke="${col}" stroke-opacity=".5" stroke-width="2"/>`;
  }
  function mapNodeHTML(n,map){
    const isRoot=!n.parent, col=n.color||map.color||'#6E8BEF';
    const sized=n.w?`--mw:${n.w}px`:'';
    const sel=mapSel.has(n.id)?'sel':'';
    return `<div class="map-node ${isRoot?'root':''} ${sel}" data-mnode="${n.id}" style="left:${n.x+MAP_ORIGIN}px;top:${n.y+MAP_ORIGIN}px;--mc:${col}">
      <span class="map-node-body ${n.w?'sized':''}" data-mopen="${n.id}" style="${sized}">${esc(n.text||'…')}</span>
      <button class="map-add" data-madd="${n.id}" title="Add branch">${ICON.plus}</button>
      <span class="map-resize" data-mresize="${n.id}" title="Resize"></span>
      ${n.note?`<span class="map-note">${esc(n.note)}</span>`:''}
    </div>`;
  }
  function viewMapEditor(){
    const map=currentMap(); if(!map){ mapId=null; return viewMapGallery(); }
    let edges='';
    map.nodes.forEach(n=>{ if(n.parent){ const p=mapNode(map,n.parent); if(p) edges+=mapCurve(p,n); } });
    const nodes=map.nodes.map(n=>mapNodeHTML(n,map)).join('');
    const emptyOverlay = map.nodes.length? '' : `<button class="map-empty-add" id="mapFirst">${ICON.plus} Add first node</button>`;
    const selBar = mapSel.size ? `<div class="map-selbar">
        <span>${mapSel.size} selected</span>
        <button id="mapGroup">${ICON.plus} Parent of these</button>
        <button id="mapSelClear">Clear</button>
      </div>` : '';
    const hint = mapSelectMode
      ? 'Select mode: drag a box around nodes · drag a selected node to move the group'
      : 'Tap a node to edit · drag to move · + branch · ⌟ resize · pinch to zoom';
    return `<div class="map-top">
        <button class="tbtn" id="mapBack">${ICON.back} All maps</button>
        <input class="map-name" id="mapName" value="${esc(map.name)}"/>
        <button class="tbtn" id="mapAddRoot">${ICON.plus} Node</button>
      </div>
      <div class="cv-viewport" id="mapViewport">
        <div class="cv-world" id="mapWorld">
          <svg class="cv-links" id="mapLinks" width="${MAP_WORLD}" height="${MAP_WORLD}">${edges}</svg>
          ${nodes}
        </div>
        ${emptyOverlay}
        <div class="cv-controls">
          <button id="mapSelect" class="${mapSelectMode?'active':''}" title="Multi-select">▣</button>
          <button id="mapZoomIn" title="Zoom in">+</button>
          <button id="mapZoomOut" title="Zoom out">−</button>
          <button id="mapFit" title="Fit">⤢</button>
        </div>
        ${selBar}
        <div class="cv-hint">${hint}</div>
      </div>`;
  }

  function fitMap(vp,world){
    const map=currentMap();
    if(!map||!map.nodes.length){ mcam={scale:1,x:vp.clientWidth/2-MAP_ORIGIN,y:vp.clientHeight/2-MAP_ORIGIN}; return; }
    let minx=1e9,miny=1e9,maxx=-1e9,maxy=-1e9;
    map.nodes.forEach(n=>{ minx=Math.min(minx,n.x); miny=Math.min(miny,n.y); maxx=Math.max(maxx,n.x); maxy=Math.max(maxy,n.y); });
    const pad=140, w=(maxx-minx)+pad*2, h=(maxy-miny)+pad*2;
    const s=Math.max(0.35,Math.min(1.2, Math.min(vp.clientWidth/w, vp.clientHeight/h)));
    const cx=(minx+maxx)/2+MAP_ORIGIN, cy=(miny+maxy)/2+MAP_ORIGIN;
    mcam={scale:s, x:vp.clientWidth/2-cx*s, y:vp.clientHeight/2-cy*s};
  }
  function applyMapCam(world){ world.style.transform=`translate(${mcam.x}px,${mcam.y}px) scale(${mcam.scale})`; }
  function mapZoom(f,vp,world,e){
    const prev=mcam.scale, s=Math.max(0.3,Math.min(2,prev*f)), rect=vp.getBoundingClientRect();
    const cx=e?e.clientX-rect.left:vp.clientWidth/2, cy=e?e.clientY-rect.top:vp.clientHeight/2;
    mcam.x=cx-(cx-mcam.x)*(s/prev); mcam.y=cy-(cy-mcam.y)*(s/prev); mcam.scale=s; applyMapCam(world);
  }
  function mapWorldPoint(e,vp){ const r=vp.getBoundingClientRect(); return {x:(e.clientX-r.left-mcam.x)/mcam.scale,y:(e.clientY-r.top-mcam.y)/mcam.scale}; }

  function wireMaps(){
    if(!mapId){
      const nb=document.getElementById('newMapBtn'); if(nb) nb.onclick=()=>{ const n=prompt('Name this mind map'); newMap(n&&n.trim()?n.trim():'Untitled map'); };
      document.querySelectorAll('[data-mapopen]').forEach(el=>el.onclick=e=>{ if(e.target.closest('[data-mapmenu]')) return; openMap(el.dataset.mapopen); });
      document.querySelectorAll('[data-mapmenu]').forEach(el=>el.onclick=e=>{ e.stopPropagation(); openMapMenu(el.dataset.mapmenu,e); });
      return;
    }
    wireMapCanvas();
  }
  function openMapMenu(id,e){
    closeRowMenu();
    const m=document.createElement('div'); m.className='cv-addmenu'; m.id='rowMenu';
    m.innerHTML=`<button data-a="open">Open</button><button data-a="rename">Rename</button><button data-a="del" class="danger">Delete map</button>`;
    document.body.appendChild(m);
    m.style.left=Math.max(8,Math.min(e.clientX,window.innerWidth-186))+'px'; m.style.top=Math.max(8,Math.min(e.clientY,window.innerHeight-160))+'px';
    m.querySelectorAll('button').forEach(b=>b.onclick=()=>{ const a=b.dataset.a; closeRowMenu();
      if(a==='open') openMap(id);
      else if(a==='rename'){ const mp=mapById(id); const n=prompt('Rename map',mp.name); if(n&&n.trim()){ mp.name=n.trim(); persist(); render(); } }
      else if(a==='del'){ if(confirm('Delete this whole mind map?')) deleteMap(id); }
    });
    setTimeout(()=>document.addEventListener('pointerdown',closeRowMenuOnce,{once:true}),0);
  }
  function wireMapCanvas(){
    const vp=document.getElementById('mapViewport'), world=document.getElementById('mapWorld');
    if(!vp||!world) return;
    if(!mcam) fitMap(vp,world);
    applyMapCam(world);
    const bk=document.getElementById('mapBack'); if(bk) bk.onclick=()=>{ mapId=null; mapSel.clear(); mapSelectMode=false; render(); };
    const nm=document.getElementById('mapName'); if(nm) nm.onchange=()=>{ const map=currentMap(); if(map&&nm.value.trim()){ map.name=nm.value.trim(); persist(); } };
    const ar=document.getElementById('mapAddRoot'); if(ar) ar.onclick=()=>{ const n=addMapNode(null); if(n) openMapNode(n.id); };
    const mf=document.getElementById('mapFirst'); if(mf) mf.onclick=()=>{ const n=addMapNode(null); if(n) openMapNode(n.id); };
    const zi=document.getElementById('mapZoomIn'); if(zi) zi.onclick=()=>mapZoom(1.2,vp,world);
    const zo=document.getElementById('mapZoomOut'); if(zo) zo.onclick=()=>mapZoom(1/1.2,vp,world);
    const ft=document.getElementById('mapFit'); if(ft) ft.onclick=()=>{ fitMap(vp,world); applyMapCam(world); };
    const sel=document.getElementById('mapSelect'); if(sel) sel.onclick=()=>{ mapSelectMode=!mapSelectMode; if(!mapSelectMode) mapSel.clear(); render(); };
    const gp=document.getElementById('mapGroup'); if(gp) gp.onclick=makeParentOfSelected;
    const sc=document.getElementById('mapSelClear'); if(sc) sc.onclick=()=>{ mapSel.clear(); render(); };

    // add-branch buttons shouldn't start a drag
    document.querySelectorAll('[data-madd]').forEach(el=>{ el.onpointerdown=e=>e.stopPropagation(); el.onclick=e=>{ e.stopPropagation(); const n=addMapNode(el.dataset.madd); if(n) openMapNode(n.id); }; });

    // resize handles
    document.querySelectorAll('[data-mresize]').forEach(h=>{
      h.onpointerdown=e=>{
        e.stopPropagation();
        const map=currentMap(), n=mapNode(map,h.dataset.mresize); if(!n) return;
        const bodyEl=h.closest('.map-node').querySelector('.map-node-body');
        const sx=e.clientX, startW=n.w||bodyEl.offsetWidth||160;
        h.setPointerCapture(e.pointerId);
        const move=ev=>{ const dx=(ev.clientX-sx)/mcam.scale; n.w=Math.max(90,Math.min(360,Math.round(startW+dx*2))); bodyEl.classList.add('sized'); bodyEl.style.setProperty('--mw',n.w+'px'); redrawMapLinks(); };
        const up=()=>{ h.removeEventListener('pointermove',move); h.removeEventListener('pointerup',up); persist(); };
        h.addEventListener('pointermove',move); h.addEventListener('pointerup',up);
      };
    });

    // background: pan, or marquee-select in select mode
    vp.onpointerdown=e=>{
      if(pinching) return;
      if(e.target.closest('.map-node')||e.target.closest('.cv-controls')||e.target.closest('.map-selbar')) return;
      if(mapSelectMode){ startMapMarquee(e,vp,world); return; }
      const sx=e.clientX-mcam.x, sy=e.clientY-mcam.y; let moved=false;
      vp.setPointerCapture(e.pointerId);
      const move=ev=>{ if(pinching) return; moved=true; mcam.x=ev.clientX-sx; mcam.y=ev.clientY-sy; applyMapCam(world); };
      const up=()=>{ vp.removeEventListener('pointermove',move); vp.removeEventListener('pointerup',up); if(!moved&&mapSel.size){ mapSel.clear(); render(); } };
      vp.addEventListener('pointermove',move); vp.addEventListener('pointerup',up);
    };
    vp.onwheel=e=>{ e.preventDefault(); mapZoom(e.deltaY<0?1.1:1/1.1,vp,world,e); };

    // pinch
    let pinch=null; const dist=(a,b)=>Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
    vp.addEventListener('touchstart',e=>{ if(e.touches.length>=2){ pinching=true; const r=vp.getBoundingClientRect(),a=e.touches[0],b=e.touches[1]; const mx=(a.clientX+b.clientX)/2-r.left,my=(a.clientY+b.clientY)/2-r.top; pinch={d0:dist(a,b),s0:mcam.scale,midWorld:{x:(mx-mcam.x)/mcam.scale,y:(my-mcam.y)/mcam.scale}}; } },{passive:false});
    vp.addEventListener('touchmove',e=>{ if(pinch&&e.touches.length>=2){ e.preventDefault(); const r=vp.getBoundingClientRect(),a=e.touches[0],b=e.touches[1]; const mx=(a.clientX+b.clientX)/2-r.left,my=(a.clientY+b.clientY)/2-r.top; const s=Math.max(0.3,Math.min(2,pinch.s0*(dist(a,b)/pinch.d0))); mcam.scale=s; mcam.x=mx-pinch.midWorld.x*s; mcam.y=my-pinch.midWorld.y*s; applyMapCam(world); } },{passive:false});
    const endPinch=e=>{ if(e.touches.length<2){ pinch=null; setTimeout(()=>{ pinching=false; },60); } };
    vp.addEventListener('touchend',endPinch); vp.addEventListener('touchcancel',endPinch);

    // node drag (single or group) / tap-to-edit / toggle-in-select-mode
    document.querySelectorAll('[data-mopen]').forEach(body=>{
      body.onpointerdown=e=>{
        if(pinching) return;
        e.stopPropagation();
        const id=body.dataset.mopen, map=currentMap(), n=mapNode(map,id); if(!n) return;
        const nodeEl=body.closest('.map-node');
        const touch=e.pointerType==='touch', threshold=touch?12:5;
        const groupIds=(mapSel.has(id)&&mapSel.size>1)?[...mapSel]:[id];
        const snaps={}; groupIds.forEach(gid=>{ const g=mapNode(map,gid); if(g) snaps[gid]={x:g.x,y:g.y}; });
        const sx=e.clientX, sy=e.clientY; let dragging=false, suppressed=false;
        body.setPointerCapture(e.pointerId);
        const move=ev=>{
          if(pinching){ suppressed=true; return; }
          const dxs=ev.clientX-sx, dys=ev.clientY-sy;
          if(!dragging&&Math.hypot(dxs,dys)>threshold){ dragging=true; nodeEl.classList.add('grabbing'); }
          if(dragging){
            const dx=dxs/mcam.scale, dy=dys/mcam.scale;
            groupIds.forEach(gid=>{ const g=mapNode(map,gid); if(!g||!snaps[gid]) return; g.x=snaps[gid].x+dx; g.y=snaps[gid].y+dy;
              const el=document.querySelector('.map-node[data-mnode="'+gid+'"]'); if(el){ el.style.left=(g.x+MAP_ORIGIN)+'px'; el.style.top=(g.y+MAP_ORIGIN)+'px'; } });
            redrawMapLinks();
          }
        };
        const up=()=>{
          body.removeEventListener('pointermove',move); body.removeEventListener('pointerup',up);
          nodeEl.classList.remove('grabbing');
          if(dragging){ groupIds.forEach(gid=>{ const g=mapNode(map,gid); if(g){ g.x=Math.round(g.x); g.y=Math.round(g.y); } }); persist(); }
          else if(!suppressed&&!pinching){
            if(mapSelectMode){ if(mapSel.has(id)) mapSel.delete(id); else mapSel.add(id); render(); }
            else openMapNode(id);
          }
        };
        body.addEventListener('pointermove',move); body.addEventListener('pointerup',up);
      };
    });
  }
  function startMapMarquee(e,vp,world){
    const p0=mapWorldPoint(e,vp);
    const box=document.createElement('div'); box.className='cv-marquee'; world.appendChild(box);
    vp.setPointerCapture(e.pointerId);
    const move=ev=>{ const p=mapWorldPoint(ev,vp); box.style.left=Math.min(p0.x,p.x)+'px'; box.style.top=Math.min(p0.y,p.y)+'px'; box.style.width=Math.abs(p.x-p0.x)+'px'; box.style.height=Math.abs(p.y-p0.y)+'px'; };
    const up=ev=>{
      vp.removeEventListener('pointermove',move); vp.removeEventListener('pointerup',up);
      const p=mapWorldPoint(ev,vp), map=currentMap();
      const rx1=Math.min(p0.x,p.x), ry1=Math.min(p0.y,p.y), rx2=Math.max(p0.x,p.x), ry2=Math.max(p0.y,p.y);
      mapSel.clear();
      if(map) map.nodes.forEach(n=>{ const cx=n.x+MAP_ORIGIN, cy=n.y+MAP_ORIGIN; if(cx>=rx1&&cx<=rx2&&cy>=ry1&&cy<=ry2) mapSel.add(n.id); });
      box.remove(); render();
    };
    vp.addEventListener('pointermove',move); vp.addEventListener('pointerup',up);
  }
  function redrawMapLinks(){
    const map=currentMap(); const svg=document.getElementById('mapLinks'); if(!svg||!map) return;
    let s=''; map.nodes.forEach(n=>{ if(n.parent){ const p=mapNode(map,n.parent); if(p) s+=mapCurve(p,n); } });
    svg.innerHTML=s;
  }
  function renderMapNodeSheet(){
    const host=document.getElementById('sheetHost');
    const map=currentMap(); const n=map?mapNode(map,mapNodeId):null;
    if(!n){ mapNodeId=null; host.innerHTML=''; return; }

    host.innerHTML=`<div class="scrim" id="scrim"><div class="sheet" id="sheet">
      <div class="grabber"></div>
      <div class="sheet-head"><span class="sheet-dot" style="background:${col}"></span>
        <input class="sheet-title" id="mnText" value="${esc(n.text)}" placeholder="Node text"/></div>
      <div class="kind-tag">${n.parent?'BRANCH':'CENTRAL NODE'}</div>
      <div class="field"><label>Colour</label><div class="swatches">${MAP_COLORS.map(c=>`<span class="sw ${n.color===c?'sel':''}" style="background:${c}" data-mcolor="${c}"></span>`).join('')}</div></div>
      <div class="field"><label>Note beside node</label><textarea id="mnNote" class="sheet-notes" placeholder="A short reminder shown next to this node…">${esc(n.note||'')}</textarea></div>
      <div class="sheet-foot">

        <button class="btn cal" id="mnInsert">${ICON.target} Insert parent</button>
        <button class="btn del" id="mnDel">Delete</button>
      </div>
    </div></div>`;
    const close=()=>{ mapNodeId=null; renderSheet(); render(); };
    document.getElementById('scrim').onclick=e=>{ if(e.target.id==='scrim') close(); };
    const ti=document.getElementById('mnText'); ti.onchange=()=>{ n.text=ti.value; map.ts=new Date().toISOString(); persist(); render(); };
    const noteEl=document.getElementById('mnNote'); if(noteEl) noteEl.onchange=()=>{ n.note=noteEl.value.trim(); map.ts=new Date().toISOString(); persist(); render(); };
    document.querySelectorAll('[data-mcolor]').forEach(el=>el.onclick=()=>{ n.color=el.dataset.mcolor; persist(); renderMapNodeSheet(); render(); });
    document.getElementById('mnAdd').onclick=()=>{ const c=addMapNode(n.id); if(c){ mapNodeId=c.id; renderMapNodeSheet(); render(); } };
    document.getElementById('mnInsert').onclick=()=>{ const p=insertParentOf(n.id); if(p){ mapNodeId=p.id; renderMapNodeSheet(); render(); } };
    document.getElementById('mnDel').onclick=()=>{ if(confirm('Delete this node'+ (map.nodes.some(x=>x.parent===n.id)?' and its branches':'') +'?')) removeMapNode(n.id); };
  }
